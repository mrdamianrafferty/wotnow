name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (CI)
        run: npm run lint:ci

      # New objects in public get no Data API grants from 2026-10-30.
      - name: New migrations grant what they create
        if: ${{ !cancelled() }}
        run: npm run check:migration-grants
