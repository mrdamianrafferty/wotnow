name: Ingest NOAA OISST Data

on:
  schedule:
    # Run every 6 hours at :15 past the hour
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to ingest (california, florida, newyork, americas, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - california
          - florida
          - newyork
          - gulf
          - pacific-nw
          - hawaii
          - americas
      limit:
        description: 'Max cells per region'
        required: false
        default: '10'
        type: string

jobs:
  ingest-noaa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local

      - name: Ingest California (10 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'california' || github.event_name == 'schedule'
        run: |
          echo "🌊 Ingesting California coastal grids..."
          npx tsx scripts/call-ingest-function.ts --california --limit=20
        continue-on-error: true

      - name: Ingest Florida (10 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'florida' || github.event_name == 'schedule'
        run: |
          echo "🌊 Ingesting Florida coastal grids..."
          npx tsx scripts/call-ingest-function.ts --florida --limit=20
        continue-on-error: true

      - name: Ingest New York (10 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'newyork' || github.event_name == 'schedule'
        run: |
          echo "🌊 Ingesting New York coastal grids..."
          npx tsx scripts/call-ingest-function.ts --newyork --limit=20
        continue-on-error: true

      - name: Ingest Gulf of Mexico (10 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'gulf'
        run: |
          echo "🌊 Ingesting Gulf of Mexico grids..."
          npx tsx scripts/call-ingest-function.ts --gulf --limit=20
        continue-on-error: true

      - name: Ingest Pacific Northwest (10 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'pacific-nw'
        run: |
          echo "🌊 Ingesting Pacific Northwest grids..."
          npx tsx scripts/call-ingest-function.ts --pacific-nw --limit=20
        continue-on-error: true

      - name: Ingest Hawaii (10 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'hawaii'
        run: |
          echo "🌊 Ingesting Hawaii grids..."
          npx tsx scripts/call-ingest-function.ts --hawaii --limit=20
        continue-on-error: true

      - name: Check coverage
        if: always()
        run: |
          echo "📊 Checking current data coverage..."
          npx tsx -e "(async () => {\nimport { createClient } from '@supabase/supabase-js';\nconst supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);\n\nconst { count: totalCount } = await supabase\n  .from('grid_conditions_latest')\n  .select('*', { count: 'exact', head: true });\n\nconst { count: noaaCount } = await supabase\n  .from('grid_conditions_latest')\n  .select('*', { count: 'exact', head: true })\n  .contains('sources', ['ncdcOisst21Agg_LonPM180.sst']);\n\nconst { count: mockCount } = await supabase\n  .from('grid_conditions_latest')\n  .select('*', { count: 'exact', head: true })\n  .contains('sources', ['MOCK_DATA_FOR_TESTING']);\n\nconsole.log('📊 Data Coverage Summary:');\nconsole.log('  Total grids with data: ' + totalCount + ' / 65,884 (' + (totalCount/65884*100).toFixed(2) + '%)');\nconsole.log('  Real NOAA grids: ' + noaaCount);\nconsole.log('  Mock data grids: ' + mockCount);\nconsole.log('  Real data coverage: ' + ((noaaCount/(noaaCount+mockCount))*100).toFixed(1) + '%');\n})()"

      - name: Report status
        if: always()
        run: |
          echo "✅ NOAA data ingestion workflow completed"
          echo "See coverage summary above for current status"
