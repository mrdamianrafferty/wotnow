name: Ingest NOAA OISST Data

on:
  schedule:
    # Run every 1 hours at :15 past the hour
    - cron: '15 */1 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to ingest (california, florida, newyork, americas, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - california
          - florida
          - newyork
          - gulf
          - pacific-nw
          - hawaii
          - americas
      limit:
        description: 'Max cells per region'
        required: false
        default: '50'
        type: string

jobs:
  ingest-noaa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local

      - name: Ingest California (20 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'california' || github.event_name == 'schedule'
        run: |
          echo "🌊 Ingesting California coastal grids..."
          npx tsx scripts/call-ingest-function.ts --california --limit=50

      - name: Ingest Florida (20 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'florida' || github.event_name == 'schedule'
        run: |
          echo "🌊 Ingesting Florida coastal grids..."
          npx tsx scripts/call-ingest-function.ts --florida --limit=50

      - name: Ingest New York (20 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'newyork' || github.event_name == 'schedule'
        run: |
          echo "🌊 Ingesting New York coastal grids..."
          npx tsx scripts/call-ingest-function.ts --newyork --limit=50

      - name: Ingest Gulf of Mexico (20 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'gulf'
        run: |
          echo "🌊 Ingesting Gulf of Mexico grids..."
          npx tsx scripts/call-ingest-function.ts --gulf --limit=50

      - name: Ingest Pacific Northwest (20 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'pacific-nw'
        run: |
          echo "🌊 Ingesting Pacific Northwest grids..."
          npx tsx scripts/call-ingest-function.ts --pacific-nw --limit=50

      - name: Ingest Hawaii (20 grids)
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'hawaii'
        run: |
          echo "🌊 Ingesting Hawaii grids..."
          npx tsx scripts/call-ingest-function.ts --hawaii --limit=50

      - name: Check coverage
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "📊 Checking current data coverage..."
          npx tsx -e "(async () => { const { createClient } = await import('@supabase/supabase-js'); const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY); const { count: totalCount } = await supabase.from('grid_conditions_latest').select('*', { count: 'exact', head: true }); const { count: noaaCount } = await supabase.from('grid_conditions_latest').select('*', { count: 'exact', head: true }).contains('sources', ['ncdcOisst21Agg_LonPM180.sst']); const { count: mockCount } = await supabase.from('grid_conditions_latest').select('*', { count: 'exact', head: true }).contains('sources', ['MOCK_DATA_FOR_TESTING']); console.log('📊 Data Coverage Summary:'); console.log('  Total grids with data: ' + totalCount + ' / 65,884 (' + (totalCount/65884*100).toFixed(2) + '%'); console.log('  Real NOAA grids: ' + noaaCount); console.log('  Mock data grids: ' + mockCount); console.log('  Real data coverage: ' + ((noaaCount/(noaaCount+mockCount))*100).toFixed(1) + '%'); })()"

      - name: Report status
        if: always()
        run: |
          echo "Job status: ${{ job.status }}"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ NOAA data ingestion workflow completed successfully"
          else
            echo "❌ NOAA data ingestion workflow encountered failures. Check logs above for details."
          fi
          echo "See coverage summary above for current status"
