name: FINDR Copernicus ingestion (daily)

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: findr-copernicus-ingest
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'mrdamianrafferty/wotnow' }}
    timeout-minutes: 120  # Longer timeout for Copernicus data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Copernicus data ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          FINDR_CONDITIONS_DELAY_MS: '500'
        run: npx tsx scripts/ingest-copernicus-data.ts
