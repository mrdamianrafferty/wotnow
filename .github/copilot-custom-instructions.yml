Human-Readable Explanations (how we write them)
	•	One-line verdict (“Good for sea fishing”).
	•	One-sentence why (mention 2–3 strongest factors with units + sources).
	•	2–4 bullet reasons (short, factual, unit-labelled).
	•	Link an “How we decided this” panel with inputs, thresholds, and score breakdown.

(See /docs/scoring.md, /docs/astronomy.md, /docs/locations.md for templates and examples.)

⸻

Common Mistakes & Guardrails (bake these in)

Copilot: Use this as a pre-commit checklist.

	1.	Define state and hooks at the top of React components. Check that everything that needs to be there is there and in the right place.
	2.	Check variable scope in effects/JSX (homeLocation, hasMounted, API responses) before use.
	3.	Do not render a component inside its own file (no self-render except explicit demos).
	4.	Pass full data objects to children when they need more than a summary.
	5.	Consistent naming (fullOpenWeatherResponse, weatherData)—don’t mix synonyms.
	6.	Graceful loading/error states—never assume data is present.
	7.	Centralise API fetch logic in hooks/utilities; never duplicate endpoints.
	8.	Type API responses with TS interfaces; avoid any and optional-chain defensively.
	9.	Log API responses in development to verify shape before wiring to UI.
	10.	Document component props and data shapes (JSDoc or comments).
	11.	Units normalisation is mandatory—especially OpenWeather m/s vs Stormglass potential knots. Convert first, then compute.
	12.	Know provider coverage limits—Stormglass is coastal; don’t query it with inland lat/lon.
	13.	Visibility units—OpenWeather visibility may be metres; convert to km before display/logic.
	14.	Timezones—store as UTC, display with local offset in UI.
	15.	Activity thresholds live in /src/data—extend there, not ad-hoc inside components.
  16.  Never delete code that is not related to what you are directly working on. If any functionality has to be removed, always ask first.
  17. If you ever have to add placeholder content, check that you have reverted to full code afterwards.

