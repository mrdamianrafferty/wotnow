	•	src/utils – Units, scoring, formatting, explanations
	•	public – Static assets (icons, manifest)
	•	docs – Human-readable explanations and calculation notes

⸻

Documentation Expectations
	•	Scoring changes → /docs/scoring.md (date, rationale, examples).
	•	Astronomy/ISS logic → /docs/astronomy.md (inputs, visibility rules, examples).
	•	Location/orientation → /docs/locations.md (bearing logic, wind classification, caveats).
	•	Big changes: add screenshots/snippets for clarity.

⸻

Examples & Starters
	•	Unit conversions: src/utils/units.ts (see pattern above).
	•	Explanations builder: src/utils/explanations.ts (produce verdict + sentence + bullets; include units + sources).
	•	Types: Define OpenWeatherTypes.ts, StormglassTypes.ts etc. with exact field names and units noted in comments.

