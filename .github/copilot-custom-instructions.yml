Copilot Instructions – WotNow

WotNow is a weather-aware activity companion. It recommends safe, fun, practical activities based on weather, sea state, location, astronomy/ISS, and personal interests. These rules apply to all Copilot Chat, code suggestions, and reviews in this repository.

🔑 Quick Rules (read me first)
	•	Stack: React + TypeScript + Vite + Tailwind + shadcn/ui.
	•	Primary data sources:
	•	OpenWeather (weather + moon phase)
	•	Stormglass (marine: waves/swell/wind)
	•	Open-Meteo (UV, soil)
	•	Google Maps API (places, geocoding, autocomplete)
	•	ISS + meteor shower sources (document in code when used)
	•	Units: Always state and normalise units in code comments and when computing scores.
	•	Activities: Every outdoor activity must define poor / fair / good / perfect thresholds.
	•	Tone: Friendly, practical, non-corporate. British English spellings.
	•	Documentation: For any calculation/score, explain the method and inputs (with units + sources) in comments and/or /docs.
	•	Reuse: Prefer existing hooks/utils/types; do not duplicate logic.


 

