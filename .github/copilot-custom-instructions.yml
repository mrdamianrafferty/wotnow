Commenting Templates (must use)

Copilot: insert these headers for any non-trivial function/hook/component and fill every field.

Utility / Calculation

/**
 * Purpose: <what/why, in plain English>
 * Inputs:  <name>: <type> — <units, valid range, SOURCE: Provider.field>
 * Output:  <type> — <units/scale and meaning>
 * Method:  <formula/weights/thresholds, with rationale>
 * Assumptions & Caveats: <fallbacks, known gaps>
 * Units & Sources: <explicit list of fields and conversions used>
 * Example: <input -> output>
 */

React Hook

/**
 * Purpose: <what it fetches/computes and how UI uses it>
 * Params:  <name>: <type> — <units/source/expectations>
 * Returns: data, loading, error, meta? (timestamps/units/provenance)
 * Data Flow & Sources: <APIs used + field names + units>
 * Error & Retry: <strategy/backoff/fallbacks>
 * Notes: <memoisation, deps, perf>
 */

UI Component

/**
 * Purpose: <what the user sees and why>
 * Props:   <name>: <type> — <units/defaults>
 * Data:    <hooks/context used; units>
 * Accessibility: <ARIA roles/labels, keyboard>
 * States:  <loading/empty/error handling>
 */


