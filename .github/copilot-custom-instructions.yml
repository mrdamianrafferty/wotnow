API Capability & Field/Units Matrix

Copilot: do not guess. If a field isn’t listed here, check the provider docs or the local types before using it.

Weather & Environment

Provider	What we rely on	Example fields (exact names)	Units (normalise to)	Notes / Gaps
OpenWeather	Air temp, wind, gusts, precip, clouds, visibility, sunrise/sunset, moon phase	temp, feels_like, wind_speed, wind_gust, rain.1h, snow.1h, clouds, visibility, sunrise, sunset, moon_phase	Metric (°C, m/s, mm/hr, %, km, ISO8601)	Moon phase value 0..1 (0/1 New, 0.5 Full). Visibility often metres → convert to km.
Stormglass	Marine wind/wave/swell for coastal points	windSpeed, gust, waveHeight, swellHeight, swellPeriod, swellDirection, waterTemperature	⚠️ See note below	Coastal only (many inland points return null).
Open-Meteo	UV index, soil moisture/temp (hourly)	uv_index, soil_moisture, soil_temperature	UV: index 0–11+, soil: provider’s units → document	Use for comfort/safety modifiers.

Critical units warning (real-world bug we hit):
OpenWeather’s wind_speed is m/s.
Stormglass windSpeed may be returned in knots depending on endpoint/params. Always confirm and normalise to m/s. This mismatch has previously caused incorrect scores.
Policy: Treat all internal wind speeds as m/s and document any conversion.

Location & Orientation

Provider	What	Fields	Units	Notes
Google Maps API	Places autocomplete, geocoding	place_id, formatted_address, lat/lon	Decimal degrees	Cache place_id→lat/lon. Respect quotas. Bias results to user region.

Night Sky (Astronomy, ISS, Meteors)

Topic	Source	Fields	Units	Notes
Sun & Moon	OpenWeather	sunrise, sunset, moon_phase	ISO8601 UTC (+ local offset in UI), 0..1 phase	OW is our primary moon phase.
ISS passes	(Document in code)	pass window, azimuth, elevation, magnitude	UTC times, °, mag	Mark provider in hook header. Explain visibility rule.
Meteor showers	(Catalogue documented in code)	peak date/time, ZHR, radiant	UTC, meteors/hour	Use friendly explanations; consider moon/cloud penalties.


⸻

Unit Normalisation Policy
	•	Internal standards:
	•	Temperature °C
	•	Wind/Gust m/s
	•	Wave/Swell height m
	•	Swell period s
	•	Precipitation mm/hr
	•	Cloud %
	•	Visibility km
	•	Bearings/azimuth/elevation degrees
	•	Never mix units inside calculations. Convert before scoring.
	•	Always annotate conversions in comments (from → to; factor used).

Mini helper pattern:

// utils/units.ts
export const KNOTS_TO_MS = 0.514444;
export const MS_TO_KNOTS = 1 / KNOTS_TO_MS;
export const M_TO_FT = 3.28084;

export function knotsToMs(knots: number): number { return knots * KNOTS_TO_MS; }
export function metresToKm(m: number): number { return m / 1000; }


