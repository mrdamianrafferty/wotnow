version: 1
name: apply_sensible_env_data_restrictions
description: >
  Add server-side proxy routes with caching, request coalescing, and rate limits
  for Open-Meteo, OpenWeather, and Stormglass. Keep EnvironmentalIndicators.tsx,
  but drive its 'stale' flags from proxy metadata. Target: reduce redundant calls
  and prevent quota burn during hot reloads or error loops.

assumptions:
  - Framework: Next.js (App Router). Adjust paths if using Pages Router.
  - Runtime: Node 18+ (fetch, AbortController available).
  - No external cache service required; use in-memory LRU in dev, easy swap for Redis later.

env:
  required:
    - OPENWEATHER_API_KEY
    - STORMGLASS_API_KEY

design_principles:
  - Single proxy per provider; front-end must never call third-party APIs directly.
  - Cache by “semantic key” (provider+lat+lon+vars+granularity+domain).
  - One request per provider per location window at a time (single-flight).
  - Respect model cadence: prefer longer TTLs over frequent revalidation.
  - Never retry on 401/403/404/429. Short exponential back-off elsewhere.
  - Circuit-break noisy providers temporarily and serve stale.

files:
  - path: components/EnvironmentalIndicators.tsx
    language: typescriptreact
    action: ensure_exists
    notes: >
      Keep current behaviour. Component may receive `isStaleData` and `lastUpdated`
      from upstream callers (which will use the new proxy metadata).

  - path: lib/cache/lru.ts
    language: typescript
    content: |
      import LRU from 'lru-cache';

      // Generic LRU for server routes
      export const createLRU = () =>
        new LRU<string, { data: any; ts: number; ttl: number }>({
          max: 1000, // adjust per memory budget
        });

  - path: lib/net/singleflight.ts
    language: typescript
    content: |
      // Request coalescing: identical keys share one in-flight Promise
      const inflight = new Map<string, Promise<any>>();
      export function singleFlight<T>(key: string, fn: () => Promise<T>): Promise<T> {
        const existing = inflight.get(key);
        if (existing) return existing as Promise<T>;
        const p = fn().finally(() => inflight.delete(key));
        inflight.set(key, p);
        return p;
      }

  - path: lib/net/backoff.ts
    language: typescript
    content: |
      export async function backoffFetch(url: string, init: RequestInit, tries = 3): Promise<Response> {
        let attempt = 0;
        let lastErr: any;
        while (attempt < tries) {
          const res = await fetch(url, init);
          if ([401,403,404,429].includes(res.status)) return res; // do not retry
          if (res.ok) return res;
          lastErr = new Error(`HTTP ${res.status}`);
          await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt))); // 0.5s, 1s, 2s
          attempt++;
        }
        throw lastErr ?? new Error('backoffFetch failed');
      }

  - path: lib/net/circuitBreaker.ts
    language: typescript
    content: |
      type State = { fails: number; until?: number };
      const map = new Map<string, State>();
      export function breakerKey(provider: 'openmeteo'|'openweather'|'stormglass', slot: string) {
        return `${provider}:${slot}`;
      }
      export function isTripped(key: string) {
        const s = map.get(key);
        return !!(s && s.until && Date.now() < s.until);
      }
      export function recordResult(key: string, ok: boolean) {
        const s = map.get(key) ?? { fails: 0 };
        if (ok) { map.set(key, { fails: 0 }); return; }
        s.fails += 1;
        if (s.fails >= 5) { s.until = Date.now() + 2 * 60 * 1000; } // 2 minutes
        map.set(key, s);
      }

  - path: app/api/openmeteo/route.ts
    language: typescript
    content: |
      import { NextRequest, NextResponse } from 'next/server';
      import { createLRU } from '@/lib/cache/lru';
      import { singleFlight } from '@/lib/net/singleflight';
      import { backoffFetch } from '@/lib/net/backoff';
      import { breakerKey, isTripped, recordResult } from '@/lib/net/circuitBreaker';

      const cache = createLRU();

      // TTL guidance (ms). Adjust if needed.
      const TTL = {
        hourly: 15 * 60 * 1000,   // 15 min (UVI/AQI hourly)
        daily: 60 * 60 * 1000,    // 60 min (daily max UVI etc.)
      };

      function normaliseSearch(q: URLSearchParams) {
        // Normalise keys affecting cache identity
        const lat = q.get('latitude');
        const lon = q.get('longitude');
        const hourly = q.get('hourly') || '';
        const daily = q.get('daily') || '';
        const endpoint = q.get('endpoint') || 'air-quality'; // 'forecast' or 'air-quality'
        const domain = q.get('domains') || '';               // cams_europe or cams_global
        const tz = q.get('timezone') || 'Europe/Madrid';
        return { key: `${endpoint}:${lat},${lon}|h=${hourly}|d=${daily}|dom=${domain}|tz=${tz}`, endpoint, tz };
      }

      export async function GET(req: NextRequest) {
        const url = new URL(req.url);
        const q = url.searchParams;

        // Require explicit endpoint selection for clarity
        const endpoint = q.get('endpoint'); // 'forecast' or 'air-quality'
        if (!endpoint || !['forecast', 'air-quality'].includes(endpoint)) {
          return NextResponse.json({ error: "Provide endpoint=forecast or endpoint=air-quality" }, { status: 400 });
        }

        // Default timezone (avoid UTC/local mismatches)
        if (!q.get('timezone')) q.set('timezone', 'Europe/Madrid');

        // Sensible domain for Europe when using air-quality (pollen/AQI)
        if (endpoint === 'air-quality' && !q.get('domains')) q.set('domains', 'cams_europe');

        const { key } = normaliseSearch(q);
        const breaker = breakerKey('openmeteo', endpoint);

        if (isTripped(breaker)) {
          const stale = cache.get(key);
          if (stale) {
            return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE-BREAKER', ts: stale.ts, ttl: stale.ttl } });
          }
          return NextResponse.json({ error: 'Provider temporarily unavailable' }, { status: 503 });
        }

        // Cache hit
        const hit = cache.get(key);
        if (hit && Date.now() - hit.ts < hit.ttl) {
          return NextResponse.json({ ...hit.data, _meta: { cache: 'HIT', ts: hit.ts, ttl: hit.ttl } });
        }

        // Determine TTL (prefer daily if any daily vars requested)
        const wantsDaily = (q.get('daily') || '').trim().length > 0;
        const ttl = wantsDaily ? TTL.daily : TTL.hourly;

        const flight = async () => {
          const base = endpoint === 'forecast'
            ? 'https://api.open-meteo.com/v1/forecast'
            : 'https://air-quality-api.open-meteo.com/v1/air-quality';
          const finalUrl = `${base}?${q.toString()}`;

          try {
            const res = await backoffFetch(finalUrl, { next: { revalidate: 0 } }, 3);
            const ok = res.ok;
            if (!ok) {
              recordResult(breaker, false);
              // Serve stale if available
              const stale = cache.get(key);
              if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE', ts: stale.ts, ttl: stale.ttl, status: res.status } });
              return NextResponse.json({ error: `Open-Meteo error ${res.status}` }, { status: res.status });
            }
            const data = await res.json();
            const payload = { ...data, _meta: { cache: 'MISS', ts: Date.now(), ttl } };
            cache.set(key, { data: payload, ts: Date.now(), ttl }, { ttl });
            recordResult(breaker, true);
            return NextResponse.json(payload);
          } catch {
            recordResult(breaker, false);
            const stale = cache.get(key);
            if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE-ERR', ts: stale.ts, ttl: stale.ttl } });
            return NextResponse.json({ error: 'Open-Meteo fetch failed' }, { status: 502 });
          }
        };

        return singleFlight(key, flight);
      }

  - path: app/api/openweather/route.ts
    language: typescript
    content: |
      import { NextRequest, NextResponse } from 'next/server';
      import { createLRU } from '@/lib/cache/lru';
      import { singleFlight } from '@/lib/net/singleflight';
      import { backoffFetch } from '@/lib/net/backoff';
      import { breakerKey, isTripped, recordResult } from '@/lib/net/circuitBreaker';

      const cache = createLRU();
      const TTL = {
        current: 10 * 60 * 1000,    // 10 min
        hourly: 15 * 60 * 1000,     // 15 min
        daily: 60 * 60 * 1000,      // 60 min
      };

      export async function GET(req: NextRequest) {
        const url = new URL(req.url);
        const q = url.searchParams;
        const lat = q.get('lat');
        const lon = q.get('lon');

        if (!lat || !lon) return NextResponse.json({ error: 'lat & lon required' }, { status: 400 });

        // Use One Call 3.0; caller can supply `exclude=` to trim blocks
        const exclude = q.get('exclude') || 'minutely,alerts'; // sensible default
        q.set('exclude', exclude);
        q.set('appid', process.env.OPENWEATHER_API_KEY || '');

        const units = q.get('units') || 'metric';
        q.set('units', units);

        const key = `owm:${lat},${lon}|exc=${exclude}|u=${units}`;
        const breaker = breakerKey('openweather', 'onecall');

        if (isTripped(breaker)) {
          const stale = cache.get(key);
          if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE-BREAKER', ts: stale.ts, ttl: stale.ttl } });
          return NextResponse.json({ error: 'OpenWeather temporarily unavailable' }, { status: 503 });
        }

        const hit = cache.get(key);
        if (hit && Date.now() - hit.ts < TTL.hourly) {
          return NextResponse.json({ ...hit.data, _meta: { cache: 'HIT', ts: hit.ts, ttl: TTL.hourly } });
        }

        const flight = async () => {
          const base = 'https://api.openweathermap.org/data/3.0/onecall';
          const finalUrl = `${base}?${q.toString()}`;

          try {
            const res = await backoffFetch(finalUrl, { next: { revalidate: 0 } }, 3);
            if (!res.ok) {
              recordResult(breaker, false);
              const stale = cache.get(key);
              if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE', ts: stale.ts, ttl: TTL.hourly, status: res.status } });
              return NextResponse.json({ error: `OpenWeather error ${res.status}` }, { status: res.status });
            }
            const data = await res.json();
            const payload = { ...data, _meta: { cache: 'MISS', ts: Date.now(), ttl: TTL.hourly } };
            cache.set(key, { data: payload, ts: Date.now(), ttl: TTL.hourly }, { ttl: TTL.hourly });
            recordResult(breaker, true);
            return NextResponse.json(payload);
          } catch {
            recordResult(breaker, false);
            const stale = cache.get(key);
            if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE-ERR', ts: stale.ts, ttl: TTL.hourly } });
            return NextResponse.json({ error: 'OpenWeather fetch failed' }, { status: 502 });
          }
        };

        return singleFlight(key, flight);
      }

  - path: app/api/stormglass/route.ts
    language: typescript
    content: |
      import { NextRequest, NextResponse } from 'next/server';
      import { createLRU } from '@/lib/cache/lru';
      import { singleFlight } from '@/lib/net/singleflight';
      import { backoffFetch } from '@/lib/net/backoff';
      import { breakerKey, isTripped, recordResult } from '@/lib/net/circuitBreaker';

      const cache = createLRU();
      const TTL = {
        marine_hourly: 15 * 60 * 1000,   // 15 min for forecast pulls
      };

      export async function GET(req: NextRequest) {
        const url = new URL(req.url);
        const q = url.searchParams;
        const lat = q.get('lat');
        const lon = q.get('lng') || q.get('lon') || q.get('long') || q.get('lng');
        if (!lat || !lon) return NextResponse.json({ error: 'lat & lon required' }, { status: 400 });

        // Required params: params= (comma list). Only request what you render.
        const params = q.get('params') || 'waveHeight,windSpeed,windDirection,waterTemperature';
        q.set('params', params);

        // Time window: default to next 24h; avoid huge windows
        const now = new Date();
        const start = q.get('start') || now.toISOString();
        const end = q.get('end') || new Date(now.getTime() + 24 * 60 * 60 * 1000).toISOString();
        q.set('start', start);
        q.set('end', end);

        // Prefer specific source if you have one; else let SG choose
        // Example: q.set('source', 'noaa');

        const key = `sg:${lat},${lon}|p=${params}|${start.substring(0,13)}→${end.substring(0,13)}`;
        const breaker = breakerKey('stormglass', 'marine_hourly');

        if (isTripped(breaker)) {
          const stale = cache.get(key);
          if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE-BREAKER', ts: stale.ts, ttl: TTL.marine_hourly } });
          return NextResponse.json({ error: 'Stormglass temporarily unavailable' }, { status: 503 });
        }

        const hit = cache.get(key);
        if (hit && Date.now() - hit.ts < TTL.marine_hourly) {
          return NextResponse.json({ ...hit.data, _meta: { cache: 'HIT', ts: hit.ts, ttl: TTL.marine_hourly } });
        }

        const flight = async () => {
          const base = 'https://api.stormglass.io/v2/weather/point';
          const finalUrl = `${base}?${q.toString()}`;

          try {
            const res = await backoffFetch(finalUrl, {
              headers: { 'Authorization': process.env.STORMGLASS_API_KEY || '' },
              next: { revalidate: 0 }
            }, 3);

            if (!res.ok) {
              recordResult(breaker, false);
              const stale = cache.get(key);
              if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE', ts: stale.ts, ttl: TTL.marine_hourly, status: res.status } });
              return NextResponse.json({ error: `Stormglass error ${res.status}` }, { status: res.status });
            }
            const data = await res.json();
            const payload = { ...data, _meta: { cache: 'MISS', ts: Date.now(), ttl: TTL.marine_hourly } };
            cache.set(key, { data: payload, ts: Date.now(), ttl: TTL.marine_hourly }, { ttl: TTL.marine_hourly });
            recordResult(breaker, true);
            return NextResponse.json(payload);
          } catch {
            recordResult(breaker, false);
            const stale = cache.get(key);
            if (stale) return NextResponse.json({ ...stale.data, _meta: { cache: 'STALE-ERR', ts: stale.ts, ttl: TTL.marine_hourly } });
            return NextResponse.json({ error: 'Stormglass fetch failed' }, { status: 502 });
          }
        };

        return singleFlight(key, flight);
      }

  - path: lib/environmentals/getEnvironmentals.ts
    language: typescript
    content: |
      // Example aggregator: call proxies, add freshness metadata for UI
      type Freshness = { isStaleData: boolean; lastUpdated?: string };
      export async function getEnvironmentals(lat: number, lon: number) {
        const qs = (o: Record<string,string>) => new URLSearchParams(o).toString();

        // Open-Meteo AQI/pollen (Europe domain default from route)
        const om = await fetch(`/api/openmeteo?${qs({
          endpoint: 'air-quality',
          latitude: String(lat),
          longitude: String(lon),
          timezone: 'Europe/Madrid',
          hourly: [
            'pm2_5','pm10','ozone','nitrogen_dioxide','sulphur_dioxide','carbon_monoxide',
            'uv_index','uv_index_clear_sky',
            'alder_pollen','birch_pollen','grass_pollen','mugwort_pollen','olive_pollen','ragweed_pollen'
          ].join(','),
        })}`).then(r => r.json());

        const meta = om?._meta;
        const freshness: Freshness = {
          isStaleData: meta?.cache?.startsWith('STALE') ?? false,
          lastUpdated: meta?.ts ? new Date(meta.ts).toISOString() : undefined,
        };

        return { openMeteo: om, freshness };
      }

  - path: app/providers/DataClient.tsx
    language: typescriptreact
    content: |
      // Optional: SWR global config to dedupe calls
      import { SWRConfig } from 'swr';
      export default function DataClient({ children }: { children: React.ReactNode }) {
        return (
          <SWRConfig value={{
            dedupingInterval: 10 * 60 * 1000, // 10 minutes
            revalidateOnFocus: false,
            revalidateOnReconnect: false,
            shouldRetryOnError: (err: any) => ![401,403,404,429].includes(err?.status),
            errorRetryCount: 2
          }}>
            {children}
          </SWRConfig>
        );
      }

guidance:
  caching_ttls:
    open_meteo:
      hourly: 15m
      daily: 60m
      notes:
        - Include all needed hourly vars in a single request.
        - For Europe, prefer domains=cams_europe for AQI/pollen.
    openweather:
      hourly_block: 15m
      current_block: 10m
      daily_block: 60m
      notes:
        - Use One Call 3.0 and set exclude=minutely,alerts by default.
        - Request metric units unless explicitly overridden.
    stormglass:
      marine_hourly: 15m
      notes:
        - Limit windows to <= 24h per call.
        - Request only the params you actually render.
  rate_limits:
    client_side:
      max_parallel_per_provider: 3
      coalesce_identical_requests: true
      debounce_location_changes_ms: 400
  retries_and_breakers:
    do_not_retry_status: [401, 403, 404, 429]
    backoff_ms: [500, 1000, 2000]
    circuit_breaker:
      threshold_failures: 5
      cool_off_minutes: 2
      serve_stale_when_tripped: true
  metadata_for_ui:
    meta_key: "_meta"
    fields:
      - cache: HIT|MISS|STALE|STALE-ERR|STALE-BREAKER
      - ts: unix_ms_of_cache_write
      - ttl: ms
    map_to_component:
      isStaleData: cache starts with "STALE"
      lastUpdated: ts as ISO string

front_end_integration:
  - Replace direct provider calls with the new proxy endpoints:
    - /api/openmeteo?endpoint=forecast|air-quality&latitude=..&longitude=..&hourly=..&daily=..&timezone=Europe/Madrid
    - /api/openweather?lat=..&lon=..&exclude=minutely,alerts&units=metric
    - /api/stormglass?lat=..&lon=..&params=waveHeight,windSpeed,...&start=ISO&end=ISO
  - Consume `_meta` and pass:
      EnvironmentalIndicators: { isStaleData, lastUpdated }
  - Batch variables so each provider/location = 1 call per refresh window.

quality_checks:
  - name: avoids_duplicate_calls
    assert:
      - identical concurrent requests resolve from a single in-flight call (singleFlight)
      - cache HITs appear on repeated queries inside TTL
  - name: respects_ttls
    assert:
      - OpenWeather hourly/daily/current TTLs applied as configured
      - Open-Meteo daily TTL used when any daily var requested
  - name: bounded_windows_stormglass
    assert:
      - stormglass requests default to <= 24h if caller omits window
  - name: breaker_and_stale
    assert:
      - after N(=5) consecutive failures per provider, breaker trips for 2 minutes
      - stale cached payload served with _meta.cache=STALE-* if available
  - name: no_retry_on_blocking_codes
    assert:
      - 401/403/404/429 return without further retries

dev_tips:
  - Temporarily disable React StrictMode in dev to stop double-invoking effects.
  - Add a small debug badge showing per-provider call counts and cache HIT/MISS.
  - Log provider, key, status, duration, and _meta.cache for each proxy response.

deliverables:
  - Working proxy routes for the three providers.
  - SWR (or React Query) global config applying 10-minute de-duplication.
  - EnvironmentalIndicators fed with freshness metadata.
  - Basic documentation in code comments indicating TTLs and retry rules.

success_criteria:
  - With hot reloads, repeated navigations, and error boundaries firing, provider
    request volume per location does not exceed 1 call per provider per ~10–15 minutes.
  - UI continues to render with cached or stale data and shows a gentle stale indicator.