import { toGardenEnv } from ‘@/utils/env/gardenEnv’;
test(‘computes sunshine/daylight 7‑day means’, () => {
const daily = {
time: Array.from({length: 8}, (_,i)=>2025-06-${(i+1).toString().padStart(2,'0')}),
precipitation_sum: Array(8).fill(0),
temperature_2m_min: Array(8).fill(8),
sunshine_duration: [0, 18000, 21600, 25200, 28800, 19800, 16200, 14400],
daylight_duration:  [43200,43200,43200,43200,43200,43200,43200,43200]
} as any;
const env = toGardenEnv({ openMeteo: { daily }, openWeather: {}, climateZone: ‘8b’, elevationM: 50 });
expect(env.recent?.sunshineHoursMean7).toBeGreaterThan(0);
expect(env.recent?.daylightHoursMean7).toBeGreaterThan(10);
});

notes_for_engineers:
	•	Ensure your Open‑Meteo forecast calls include daily=daylight_duration,sunshine_duration alongside existing hourly params.
	•	Convert seconds → hours (÷3600). Prefer sunshine for light‑suitability; daylight is the upper bound.
	•	Crop light needs: use 6+ h/day for “full sun”, 4–6 h for “partial”, <4 h considered poor for sun‑lovers.
	•	Messaging stays suggestive (nudges), not hard blockers, unless combined with other adverse conditions.