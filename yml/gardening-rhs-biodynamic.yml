provides:
- recent.rain7dMm
- recent.dryDays7
- recent.rain48hMm
- recent.frostNights3
- recent.minTemp48hC
- recent.soilMoistureMean7
- recent.soilMoistureTrend
- recent.sunshineHoursMean7       # mean of last ~7 days sunshine_duration (h)
- recent.daylightHoursMean7       # mean of last ~7 days daylight_duration (h)
notes: >
Sunshine = bright‑sun hours (forecast/archive). Daylight = sunrise→sunset span. We prefer sunshine for light‑suitability.

