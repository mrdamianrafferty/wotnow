weatherService.attachOpenMeteoToForecast:
expects:
- days[].date
fetches:
- daily: [“daylight_duration”, “sunshine_duration”]  # in seconds (Open‑Meteo)
provides:
- days[].uvIndexMin
- days[].uvIndexMean
- days[].uvIndexMax
- days[].air.euAqiMax
- days[].air.euAqiMaxTime
- days[].soil.temp0cm.{min,mean,max}
- days[].soil.moisture0to1.{min,mean,max}
- days[].soil.moisture1to3.{min,mean,max}
- days[].soil.moisture3to9.{min,mean,max}
- days[].soil.moisture9to27.{min,mean,max}
- days[].soil.moisture27to81.{min,mean,max}
- days[].pollen.aggregate
- days[].pollen.dominant
- days[].pollen.severity
- days[].sunlight.daylightHours        # daylight_duration/3600
- days[*].sunlight.sunshineHours        # sunshine_duration/3600
notes: >
Attach function must include daily=daylight_duration,sunshine_duration and surface per‑day hours as numbers.

weatherService.attachAstronomyToForecast:
provides:
- days[].astronomy.sunrise
- days[].astronomy.sunset
