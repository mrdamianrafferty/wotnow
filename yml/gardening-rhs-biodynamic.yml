// src/utils/cropAdvisor.ts (sunlight‑aware)
import { buildCropSchedule } from ‘@/utils/plantingSchedule’;
import { getDailyBiodynamicAdvice } from ‘@/utils/biodynamicAdvisor’;
import type { GardenEnv } from ‘@/utils/env/gardenEnv’;

export interface CropAdvice { crop: string; active: Array<{ label: 'sowIndoors'|'sowOutdoors'|'transplant'|'harvest'; startISO: string; endISO: string }>; blockers: string[]; nudges: string[]; standardLine: string; biodynamicLine?: string; summary: string; }

const SOIL_MIN: Record<string, number> = { default: 7, Tomato: 10, Courgette: 10, 'French Bean (dwarf)': 10, 'Runner Bean': 10, Pea: 5, Carrot: 7, Beetroot: 7, Lettuce: 5, Spinach: 5, Kale: 7, 'Cabbage (summer)': 7, 'Potato (first earlies)': 7, 'Onion (from sets)': 5, 'Spring Onion': 5, Strawberry: 7 };
const CROP_LIGHT: Record<string,'full'|'partial'|'shade'> = { Tomato:'full', Courgette:'full', 'Runner Bean':'full', 'French Bean (dwarf)':'full', Strawberry:'full', Pepper:'full', Sweetcorn:'full', Lettuce:'partial', Spinach:'partial', Kale:'partial' };

export function adviseCrop(cropName: string, env: GardenEnv): CropAdvice | undefined {
  const sched = buildCropSchedule(cropName, { climateZone: env.climateZone, elevationM: env.elevationM });
  if (!sched) return undefined;
  const today = new Date().toISOString().slice(0,10);
  const active = sched.windows.filter(w => w.startISO <= today && w.endISO >= today);
  const bio = getDailyBiodynamicAdvice(env.weather);
  const blockers: string[] = [...bio.blockers];
  const nudges: string[] = [...bio.nudges];

  const soilT = env.weather.soilTemperature ?? env.soilTemp5cm;
  const minSoil = SOIL_MIN[cropName] ?? SOIL_MIN.default;
  if (soilT != null && soilT < minSoil) blockers.push(`soil too cold (${soilT.toFixed(1)} °C; needs ≥ ${minSoil} °C)`);

  if ((env.weather.precipitation ?? 0) > 8) blockers.push('heavy rain');
  if ((env.weather.gust ?? 0) > 55) blockers.push('very gusty');

  const r = env.recent || {};
  if ((r.rain7dMm ?? 0) < 15 && (r.soilMoistureTrend === 'falling' || (r.dryDays7 ?? 0) >= 5)) nudges.push('Water deeply this evening (dry week)');
  else if ((r.rain7dMm ?? 0) > 35) nudges.push('Hold off watering; soils likely saturated');
  if ((r.minTemp48hC ?? 10) >= 6 && ((r.rain48hMm ?? 0) > 5 || (r.soilMoistureMean7 ?? 0) > 0.25)) nudges.push('Protect seedlings from slugs (damp, mild nights)');

  // Sunlight suitability
  const avgSun = r.sunshineHoursMean7;
  const need = CROP_LIGHT[cropName] || 'full';
  if (typeof avgSun === 'number') {
    if (need === 'full' && avgSun < 5.5) nudges.push(`Light looks limited this week (~${avgSun.toFixed(1)} h of sunshine/day) — choose the sunniest spot or delay planting out.`);
    if (need === 'partial' && avgSun > 7.5) nudges.push('Very bright week — offer light shade in the afternoon to prevent bolting/scorch.');
  }

  const acts = active.map(a => ({ sowIndoors:'sow indoors', sowOutdoors:'sow outdoors', transplant:'transplant', harvest:'harvest' }[a.label] || 'garden')).join(', ');
  const standardLine = !active.length ? `No RHS window for ${cropName} today — check coming weeks.` : blockers.length ? `${cropName}: RHS says ${acts}, but today’s not ideal — ${blockers[0]}.` : `${cropName}: Good day to ${acts}.`;
  const biodynamicLine = `Biodynamic note — ${bio.summary.replace(/^Lovely for biodynamic rhythm:\s*/i, '')}`;
  const summary = `${standardLine} ${biodynamicLine}`.trim();
  return { crop: cropName, active, blockers, nudges, standardLine, biodynamicLine, summary };
}


