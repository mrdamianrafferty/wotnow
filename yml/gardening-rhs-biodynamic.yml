content: |
// src/utils/env/gardenEnv.ts
import type { WeatherSnapshot } from ‘@/utils/biodynamicAdvisor’;

export interface GardenEnvRecent {
  rain7dMm?: number;
  dryDays7?: number;
  frostNights3?: number;
  soilMoistureMean7?: number;
  soilMoistureTrend?: 'rising'|'falling'|'flat';
  rain48hMm?: number;
  minTemp48hC?: number;
  sunshineHoursMean7?: number;
  daylightHoursMean7?: number;
}

export interface GardenEnv {
  phase?: string;
  weather: WeatherSnapshot;
  uvIndex?: number;
  soilTemp5cm?: number;
  soilMoisture?: number;
  elevationM?: number;
  climateZone?: string;
  recent?: GardenEnvRecent;
}

export function toGardenEnv(input: {
  stormglass?: any;
  openWeather?: any;
  openMeteo?: any;
  climateZone?: string;
  elevationM?: number;
}): GardenEnv {
  const ow = input.openWeather ?? {};
  const om = input.openMeteo ?? {};
  const phase = input.stormglass?.moonPhase ?? undefined;

  const snap: WeatherSnapshot = {
    temperature: N(ow.tempC) ?? N(ow.temperature) ?? N(om.temperature_2m),
    minTemperature: N(ow.minTempC) ?? N(ow.tempMinC) ?? N(om.temperature_2m_min),
    precipitation: N(ow.precipMm) ?? N(ow.rain_mm) ?? N(om.precipitation),
    windSpeed: N(ow.windKmh) ?? ktsToKmh(N(ow.wind_speed)) ?? msToKmh(N(om.windspeed_10m)),
    gust: N(ow.gustKmh) ?? ktsToKmh(N(ow.wind_gust)) ?? msToKmh(N(om.windgusts_10m)),
    soilTemperature: N(om.soil_temperature_0cm) ?? N(om.soil_temperature_7cm),
    frostRisk: frostFromMins(N(ow.tempMinC) ?? N(ow.minTempC) ?? N(om.temperature_2m_min)),
    humidity: N(ow.humidity) ?? N(om.relative_humidity_2m),
  };

  const uvIndex = N(om.uv_index_max) ?? N(om.uv_index);
  const soilTemp5cm = N(om.soil_temperature_0cm) ?? N(om.soil_temperature_7cm);
  const soilMoisture = N(om.soil_moisture_0_to_1cm) ?? N(om.soil_moisture_0_1m) ?? N(om.soil_moisture_0_7cm);

  const recent: GardenEnvRecent = {};
  try {
    const dTime: string[] = arr(om?.daily?.time);
    const dPsum: number[] = nums(om?.daily?.precipitation_sum);
    const dTmin: number[] = nums(om?.daily?.temperature_2m_min);
    const dSun: number[] = nums(om?.daily?.sunshine_duration).map(s => s/3600);
    const dLight: number[] = nums(om?.daily?.daylight_duration).map(s => s/3600);
    if (dTime.length && dPsum.length === dTime.length) {
      const last7 = lastN(dPsum, 7);
      recent.rain7dMm = sum(last7);
      recent.dryDays7 = last7.filter(v => isFinite(v) && v < 1).length;
      recent.rain48hMm = sum(lastN(dPsum, 2));
    }
    if (dTime.length && dTmin.length === dTime.length) {
      recent.frostNights3 = lastN(dTmin, 3).filter(v => isFinite(v) && v <= 0).length;
      recent.minTemp48hC = Math.min(...lastN(dTmin, 2));
    }
    if (dLight.length) recent.daylightHoursMean7 = mean(lastN(dLight, 7));
    if (dSun.length) recent.sunshineHoursMean7 = mean(lastN(dSun, 7));

    const hSm: number[] = nums(om?.hourly?.soil_moisture_0_to_1cm ?? om?.hourly?.soil_moisture_0_1m);
    if (hSm.length) {
      const last7h = lastN(hSm, 24*7);
      recent.soilMoistureMean7 = mean(last7h);
      const last48 = lastN(hSm, 48);
      const first24 = last48.slice(0, 24);
      const next24  = last48.slice(24);
      const diff = mean(next24) - mean(first24);
      recent.soilMoistureTrend = Math.abs(diff) < 0.01 ? 'flat' : (diff > 0 ? 'rising' : 'falling');
    }
  } catch {}

  return { phase, weather: snap, uvIndex, soilTemp5cm, soilMoisture, elevationM: input.elevationM, climateZone: input.climateZone, recent };
}

function N(v: any): number | undefined { const n = typeof v === 'number' ? v : Number(v); return Number.isFinite(n) ? n : undefined; }
function arr(v: any): any[] { return Array.isArray(v) ? v : []; }
function nums(v: any): number[] { return arr(v).map(Number).filter(n => Number.isFinite(n)); }
function lastN<T>(a: T[], n: number): T[] { return a.slice(Math.max(0, a.length - n)); }
function sum(a: number[]) { return a.reduce((s, v) => s + (isFinite(v) ? v : 0), 0); }
function mean(a: number[]) { return a.length ? sum(a) / a.length : 0; }
function ktsToKmh(v?: number) { return typeof v === 'number' ? v * 1.852 : undefined; }
function msToKmh(v?: number) { return typeof v === 'number' ? v * 3.6 : undefined; }
function frostFromMins(min?: number) { return typeof min === 'number' ? min <= 1 : false; }


