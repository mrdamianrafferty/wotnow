  - id: planting_schedule
    title: "Offset + date helper from RHS windows"
    actions:
      - create_or_update_file:
          file: "${files.planting_schedule}"
          content: |
            // src/utils/plantingSchedule.ts
            import { rhsCalendar, type CropWindow, type MonthNum } from '@/data/rhsCalendar';
            import { totalGuideOffsetWeeks } from '@/utils/plantingOffsets';

            export interface DatedWindow {
              label: 'sowIndoors'|'sowOutdoors'|'transplant'|'harvest';
              startISO: string;
              endISO: string;
            }
            export interface CropScheduleOut {
              crop: string;
              windows: DatedWindow[];
              notes?: string;
              offsetWeeks: number;
            }

            function monthsToRange(months: MonthNum[], year: number) {
              const m = [...months].sort((a,b)=>a-b);
              const start = new Date(Date.UTC(year, m[0]-1, 5));
              const end   = new Date(Date.UTC(year, m[m.length-1]-1, 25));
              return { start, end };
            }
            function shiftWeeks(d: Date, w: number) {
              const out = new Date(d.getTime());
              out.setUTCDate(out.getUTCDate() + w*7);
              return out;
            }
            const iso = (d: Date) => d.toISOString().slice(0,10);

            export function buildCropSchedule(
              cropName: string,
              opts: { climateZone?: string; elevationM?: number; year?: number } = {}
            ): CropScheduleOut | undefined {
              const base = rhsCalendar.find(c => c.crop.toLowerCase() === cropName.toLowerCase());
              if (!base) return undefined;
              const year = opts.year ?? new Date().getUTCFullYear();
              const offsetWeeks = totalGuideOffsetWeeks(opts.climateZone, opts.elevationM);

              const windows: DatedWindow[] = [];
              const push = (label: DatedWindow['label'], months?: MonthNum[]) => {
                if (!months || !months.length) return;
                const { start, end } = monthsToRange(months, year);
                windows.push({ label, startISO: iso(shiftWeeks(start, offsetWeeks)), endISO: iso(shiftWeeks(end, offsetWeeks)) });
              };
              push('sowIndoors', base.sowIndoors);
              push('sowOutdoors', base.sowOutdoors);
              push('transplant', base.transplant);
              push('harvest', base.harvest);

              return { crop: base.crop, windows, notes: base.notes, offsetWeeks };
            }

            export function buildSchedules(crops: string[], opts: { climateZone?: string; elevationM?: number; year?: number } = {}) {
              return crops.map(c => buildCropSchedule(c, opts)).filter(Boolean) as CropScheduleOut[];
            }

  - id: crop_advisor_merge
    title: "Merge schedule + live weather/soil + biodynamic (for fun)"
    actions:
      - create_or_update_file:
          file: "${files.crop_advisor}"
          content: |
            // src/utils/cropAdvisor.ts
            // Combines RHS schedule + live weather/soil + biodynamicAdvisor into per-crop advice lines.
            import { buildCropSchedule, type DatedWindow } from '@/utils/plantingSchedule';
            import { getDailyBiodynamicAdvice, type WeatherSnapshot } from '@/utils/biodynamicAdvisor';
            import type { GardenEnv } from '@/utils/env/gardenEnv';

            export interface CropAdvice {
              crop: string;
              active: Array<{ label: DatedWindow['label']; startISO: string; endISO: string }>;
              blockers: string[];
              nudges: string[];
              standardLine: string;   // standards-first
              biodynamicLine?: string; // fun-only
              summary: string;        // combined one-liner
            }

            // Simple soil thresholds (°C) for practical sowing; tweak per crop if you like.
            const SOIL_MIN: Record<string, number> = {
              default: 7, Tomato: 10, Courgette: 10, 'French Bean (dwarf)': 10, 'Runner Bean': 10,
              Pea: 5, Carrot: 7, Beetroot: 7, Lettuce: 5, Spinach: 5, Kale: 7,
              'Cabbage (summer)': 7, 'Potato (first earlies)': 7, 'Onion (from sets)': 5, 'Spring Onion': 5, Strawberry: 7
            };

            export function adviseCrop(
              cropName: string,
              env: GardenEnv,
              opts: { year?: number } = {}
            ): CropAdvice | undefined {
              const sched = buildCropSchedule(cropName, {
                climateZone: env.climateZone,
                elevationM: env.elevationM,
                year: opts.year
              });
              if (!sched) return undefined;

              const today = new Date().toISOString().slice(0,10);
              const active = sched.windows.filter(w => w.startISO <= today && w.endISO >= today);

              const bio = getDailyBiodynamicAdvice(env.weather);
              const blockers = [...bio.blockers];

              // Soil gating (standards-first; biodynamic never overrides this)
              const soilT = env.weather.soilTemperature ?? env.soilTemp5cm;
              const minSoil = SOIL_MIN[cropName] ?? SOIL_MIN.default;
              if (soilT != null && soilT < minSoil) {
                blockers.push(`soil too cold for ${cropName.toLowerCase()} (${soilT.toFixed(1)} °C; needs ≥ ${minSoil} °C)`);
              }

              // Heavy rain or strong wind makes transplanting/sowing impractical
              if ((env.weather.precipitation ?? 0) > 8) blockers.push('heavy rain');
              if ((env.weather.gust ?? 0) > 55) blockers.push('very gusty');

              // Standard line
              let standardLine: string;
              if (!active.length) {
                standardLine = `No RHS window for ${cropName} today — check coming weeks.`;
              } else if (blockers.length) {
                const acts = active.map(a => labelToVerb(a.label)).join(', ');
                standardLine = `${cropName}: RHS says ${acts}, but today’s not ideal — ${blockers[0]}.`;
              } else {
                const acts = active.map(a => labelToVerb(a.label)).join(', ');
                standardLine = `${cropName}: Good day to ${acts}.`;
              }

              // Biodynamic fun-only line (re-phrase bio.summary gently)
              const biodynamicLine = `Biodynamic note — ${bio.summary.replace(/^Lovely for biodynamic rhythm:\s*/i, '')}`;

              // Combine
              const summary = blockers.length ? `${standardLine} ${biodynamicLine}` : `${standardLine} ${biodynamicLine}`;

              return {
                crop: cropName,
                active: active.map(a => ({ label: a.label, startISO: a.startISO, endISO: a.endISO })),
                blockers,
                nudges: bio.nudges,
                standardLine,
                biodynamicLine,
                summary: summary.trim()
              };
            }

            function labelToVerb(label: DatedWindow['label']) {
              switch (label) {
                case 'sowIndoors': return 'sow indoors';
                case 'sowOutdoors': return 'sow outdoors';
                case 'transplant': return 'transplant';
                case 'harvest': return 'harvest';
                default: return 'garden';
              }
            }

  - id: messages_hook
    title: "Card-level message builder (standards + biodynamic note)"
    actions:
      - create_or_update_file:
          file: "${files.garden_messages}"
          content: |
            // src/utils/messages/gardeningMessages.ts
            import type { GardenEnv } from '@/utils/env/gardenEnv';
            import { adviseCrop } from '@/utils/cropAdvisor';
            import { buildSchedules } from '@/utils/plantingSchedule';
            import { getDailyBiodynamicAdvice } from '@/utils/biodynamicAdvisor';

            export interface GardeningAdviceOut {
              header: string;
              oneLiner: string;
              reasons: string[];
              cropLines: string[]; // per-crop summaries
            }

            export function buildGardeningAdvice(env: GardenEnv, crops: string[] = []): GardeningAdviceOut {
              const bio = getDailyBiodynamicAdvice(env.weather);
              const header = bio.blockers.length
                ? 'Gardening — proceed with caution'
                : 'Gardening — looks good';

              const oneLiner = bio.summary; // already British English and contrastive

              const cropLines: string[] = [];
              for (const c of crops) {
                const a = adviseCrop(c, env);
                if (a) cropLines.push(a.summary);
              }

              const reasons = [
                ...(bio.blockers.length ? ['Weather watch-outs: ' + bio.blockers.join(', ')] : []),
              ];

              return { header, oneLiner, reasons, cropLines };
            }

  - id: ui_integration
    title: "Wire into Gardening card"
    actions:
      - locate_file_fallback:
          preferred: "${files.card_component_primary}"
          fallbacks:
            - "${files.card_component_alt}"
      - ensure_imports:
          file: "${files.card_component_primary}"
          imports:
            - "import { toGardenEnv } from '@/utils/env/gardenEnv';"
            - "import { buildGardeningAdvice } from '@/utils/messages/gardeningMessages';"
            - "import MoonNugget from '@/components/MoonNugget';"
      - integrate_snippet:
          file: "${files.card_component_primary}"
          after_pattern: "<h3 className=\"text-lg font-semibold\">Gardening</h3>|<Header>Gardening</Header>"
          code: |
            {(() => {
              const env = toGardenEnv({
                stormglass: props?.stormglass,   // has moonPhase already
                openWeather: props?.weather,
                openMeteo: props?.openMeteo,
                climateZone: props?.climateZone,
                elevationM: props?.elevationM,
              });

              // Optionally pass user's favourite crops; or keep empty to show only the one-liner
              const crops = props?.crops ?? ['Tomato','Carrot','Lettuce'];
              const adv = buildGardeningAdvice(env, crops);

              return (
                <div className="mt-2 space-y-2">
                  <p className="text-sm font-medium">{adv.header}</p>
                  <p className="text-sm">{adv.oneLiner}</p>

                  {!!adv.reasons.length && (
                    <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2">
                      {adv.reasons.map(r => <div key={r}>• {r}</div>)}
                    </div>
                  )}

                  {!!adv.cropLines.length && (
                    <ul className="text-sm list-disc pl-5">
                      {adv.cropLines.slice(0, 4).map(line => <li key={line}>{line}</li>)}
                    </ul>
                  )}

                  {/* Serendipitous folklore (no controls) */}
                  <MoonNugget className="mt-2" />
                </div>
              );
            })()}
      - commit:
          message: "feat(ui): Gardening card shows RHS+weather advice and biodynamic note"

  - id: tests
    title: "Basic tests"
    actions:
      - create_dir: "${files.tests_dir}"
      - create_file:
          path: "${files.tests_dir}/advisor.positive.test.ts"
          content: |
            import { getDailyBiodynamicAdvice } from '@/utils/biodynamicAdvisor';
            test('positive when no blockers', () => {
              const a = getDailyBiodynamicAdvice({ temperature: 16, minTemperature: 8, precipitation: 0, windSpeed: 10, gust: 18, soilTemperature: 10 });
              expect(a.blockers.length).toBe(0);
              expect(a.summary.toLowerCase()).toContain('lovely');
            });
      - create_file:
          path: "${files.tests_dir}/env.mapper.test.ts"
          content: |
            import { toGardenEnv } from '@/utils/env/gardenEnv';
            test('maps providers to GardenEnv', () => {
              const env = toGardenEnv({
                stormglass: { moonPhase: 'full' },
                openWeather: { tempC: 15, minTempC: 5, windKmh: 12, gustKmh: 25, precipMm: 0 },
                openMeteo: { soil_temperature_0cm: 9, uv_index_max: 4.5 },
                climateZone: '8b',
                elevationM: 120
              });
              expect(env.phase).toBe('full');
              expect(env.weather.temperature).toBe(15);
              expect(env.uvIndex).toBe(4.5);
            });
      - create_file:
          path: "${files.tests_dir}/crop.advice.test.ts"
          content: |
            import { adviseCrop } from '@/utils/cropAdvisor';
            import { toGardenEnv } from '@/utils/env/gardenEnv';
            test('advises tomato with soil gating', () => {
              const env = toGardenEnv({
                openWeather: { tempC: 16, minTempC: 6, windKmh: 8, gustKmh: 18, precipMm: 0 },
                openMeteo: { soil_temperature_0cm: 9 }, // below Tomato 10 °C
                climateZone: '8a', elevationM: 50
              });
              const a = adviseCrop('Tomato', env);
              expect(a?.blockers.join(' ')).toMatch(/soil too cold/i);
              expect(a?.summary.toLowerCase()).toContain('not ideal');
            });
      - commit:
          message: "test(garden): basic env, advisor and crop advice tests"

quality_gates:
  - "TS builds: npm run build"
  - "Tests pass: npm run test"
  - "Gardening card shows: header, one-liner, optional reasons, up to 4 crop lines, plus Moon nugget"
  - "Biodynamic note is appended but never used as a blocker"

rollbacks:
  - if_build_fails:
      revert_last_commit: true
      message: "revert(garden): rollback gardening advice integration"
  - if_runtime_errors:
      stash_changes_and_open_pr: true

acceptance_criteria:
  - "Stormglass moon phase is used when available; fallback still works."
  - "RHS windows appear adjusted by climate zone + elevation."
  - "Per-crop advice contrasts with weather/soil (e.g., ‘RHS says sow outdoors, but soil too cold’)."
  - "Positive days read as ‘good for any gardener’; biodynamic line is flavour only."
  - "UI renders without controls for the Moon nugget (pure serendipity)."