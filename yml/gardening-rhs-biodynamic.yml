as_a: “keen gardener”
i_want: “a handy summary of tasks for this week and a summary of my conditions”
so_that: “I can plan my activities, find inspiration, and be more productive and successful”
surfaced_in: [“gardening cards”, “pop‑ups”, “(future) notifications”]
acceptance_criteria:
	•	“Weekly list includes sow/plant/harvest prompts from active RHS windows adjusted by zone + elevation + soil gate.”
	•	“Conditions summary reflects UV, wind, rain, soil moisture trend, recent frost risk, and sunshine hours.”
	•	“A ‘How do you know that?’ explainer is available with sources, assumptions, and calculations.”

