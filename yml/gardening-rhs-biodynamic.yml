name: "WotNow: Gardening (RHS baseline + biodynamic twist)"
version: "1.0"
owner: "Damian"
project_root: "."
description: >
  Add actionable, standards-first gardening advice to cards using an RHS-style planting calendar
  (offset by climate zone + elevation) and contrast it with live weather & soil data.
  Use Stormglass moon phase if available, and append biodynamic notes for fun only.
  Integrate with existing files: src/utils/biodynamicAdvisor.ts and components/MoonNugget.tsx.

conventions:
  british_english: true
  moon_phase_source: "Stormglass preferred; fallback to internal phase helper."
  weather_sources:
    - "OpenWeather (air temp, wind, precip)"
    - "Open-Meteo (UV, soil temperature/moisture; hourly)"
  safety_note: "Biodynamic messaging must never block standard, safe horticultural guidance."

files:
  biodynamic_advisor: "src/utils/biodynamicAdvisor.ts"         # already exists
  moon_nugget_component: "src/components/MoonNugget.tsx"       # already exists
  garden_env_mapper: "src/utils/env/gardenEnv.ts"
  climate_zones: "src/data/climateZones.ts"
  planting_offsets: "src/utils/plantingOffsets.ts"
  rhs_calendar: "data/rhsCalendar.ts"
  planting_schedule: "src/utils/plantingSchedule.ts"
  crop_advisor: "src/utils/cropAdvisor.ts"
  garden_messages: "src/utils/messages/gardeningMessages.ts"
  card_component_primary: "src/components/ActivityCard.tsx"
  card_component_alt: "src/components/ActivityListItem.tsx"
  tests_dir: "tests/gardening"

phases:
  - id: sanity
    title: "Sanity & inventory"
    actions:
      - run: "node -v"
      - verify_paths:
          any_exist:
            - "${files.biodynamic_advisor}"
            - "${files.moon_nugget_component}"
      - ensure_typescript_compiles: true
    success_criteria:
      - "TypeScript compiles (or has unrelated warnings)."
      - "biodynamicAdvisor + MoonNugget present."

  - id: env_mapper
    title: "Normalise Stormglass/OpenWeather/Open-Meteo → GardenEnv"
    actions:
      - create_or_update_file:
          file: "${files.garden_env_mapper}"
          content: |
            // src/utils/env/gardenEnv.ts
            // Normalises data for gardening advice & biodynamic twist.
            import type { WeatherSnapshot } from '@/utils/biodynamicAdvisor';

            export interface GardenEnv {
              phase?: string;            // 'new' | 'waxing_crescent' | ... from Stormglass if present
              weather: WeatherSnapshot;  // mapped from OpenWeather/Open-Meteo
              uvIndex?: number;          // from Open-Meteo hourly max if available
              soilTemp5cm?: number;      // °C at 0–10 cm (Open-Meteo)
              soilMoisture?: number;     // m³/m³ (Open-Meteo)
              elevationM?: number;       // site elevation
              climateZone?: string;      // e.g. '8b'
            }

            export function toGardenEnv(input: {
              stormglass?: any;
              openWeather?: any;
              openMeteo?: any;
              climateZone?: string;
              elevationM?: number;
            }): GardenEnv {
              const ow = input.openWeather ?? {};
              const om = input.openMeteo ?? {};
              const phase = input.stormglass?.moonPhase ?? undefined;

              const snap: WeatherSnapshot = {
                temperature: N(ow.tempC) ?? N(ow.temperature) ?? N(om.temperature_2m),
                minTemperature: N(ow.minTempC) ?? N(ow.tempMinC) ?? N(om.temperature_2m_min),
                precipitation: N(ow.precipMm) ?? N(ow.rain_mm) ?? N(om.precipitation),
                windSpeed: N(ow.windKmh) ?? ktsToKmh(N(ow.wind_speed)) ?? msToKmh(N(om.wind_speed_10m)),
                gust: N(ow.gustKmh) ?? ktsToKmh(N(ow.wind_gust)) ?? msToKmh(N(om.wind_gusts_10m)),
                soilTemperature: N(om.soil_temperature_0cm) ?? N(om.soil_temperature_7cm),
                frostRisk: boolish(ow.frostRisk) || frostFromMins(N(ow.tempMinC) ?? N(ow.minTempC) ?? N(om.temperature_2m_min)),
                humidity: N(ow.humidity) ?? N(om.relative_humidity_2m),
              };

              const uvIndex = N(om.uv_index_max) ?? N(om.uv_index);
              const soilTemp5cm = N(om.soil_temperature_0cm) ?? N(om.soil_temperature_7cm);
              const soilMoisture = N(om.soil_moisture_0_1m) ?? N(om.soil_moisture_0_7cm);

              return {
                phase,
                weather: snap,
                uvIndex,
                soilTemp5cm,
                soilMoisture,
                elevationM: input.elevationM,
                climateZone: input.climateZone,
              };
            }

            function N(v: any): number | undefined {
              if (v === null || v === undefined) return undefined;
              const n = typeof v === 'number' ? v : Number(v);
              return Number.isFinite(n) ? n : undefined;
            }
            function ktsToKmh(v?: number) { return typeof v === 'number' ? v * 1.852 : undefined; }
            function msToKmh(v?: number) { return typeof v === 'number' ? v * 3.6 : undefined; }
            function boolish(v: any) { return v === true || v === 'true' || v === 1; }
            function frostFromMins(min?: number) { return typeof min === 'number' ? min <= 1 : false; }

  - id: climate_zone_offsets
    title: "Climate zones & elevation-based planting offsets"
    actions:
      - create_or_update_file:
          file: "${files.climate_zones}"
          content: |
            // data/climateZones.ts
            // Minimal zone baselines (extend as needed). Weeks offset from a reference planting window.
            export type Zone = '7a' | '7b' | '8a' | '8b' | '9a' | '9b';
            export const zoneOffsetsWeeks: Record<Zone, number> = {
              '7a': -3, '7b': -2, '8a': 0, '8b': 1, '9a': 3, '9b': 4
            };
      - create_or_update_file:
          file: "${files.planting_offsets}"
          content: |
            // src/utils/plantingOffsets.ts
            import { zoneOffsetsWeeks, type Zone } from '@/data/climateZones';

            export function zoneWeekOffset(zone?: string): number {
              if (!zone) return 0;
              const z = zone.toLowerCase() as Zone;
              return zoneOffsetsWeeks[z] ?? 0;
            }

            // crude lapse rate: ~0.6 °C per 100 m elevation → ~1 week per ~1.7 °C
            export function elevationWeekOffset(elevationM?: number): number {
              if (!Number.isFinite(elevationM || NaN)) return 0;
              const deltaC = (elevationM as number) * 0.006;
              return Math.round(-deltaC / 1.7);
            }

            export function totalGuideOffsetWeeks(zone?: string, elevationM?: number): number {
              return zoneWeekOffset(zone) + elevationWeekOffset(elevationM);
            }

  - id: rhs_calendar
    title: "RHS-style baseline calendar"
