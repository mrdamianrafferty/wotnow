// src/utils/weeklyTasks.ts (sunlight‑aware)
import type { GardenEnv } from ‘@/utils/env/gardenEnv’;
import { buildCropSchedule } from ‘@/utils/plantingSchedule’;

export interface WeeklyOut { tasks: string[]; conditions: string; }

const SUN_NEED_FULL = 6; // h/day
const SUN_NEED_PARTIAL = 4; // h/day

export function buildWeeklyTasks(env: GardenEnv, crops: string[] = []): WeeklyOut {
  const tasks: string[] = [];
  const r = env.recent || {};

  if ((r.rain7dMm ?? 0) < 15 && (r.soilMoistureTrend === 'falling' || (r.dryDays7 ?? 0) >= 5)) tasks.push('Water deeply this evening; add a light mulch to hold moisture.');
  else if ((r.rain7dMm ?? 0) > 35) tasks.push('Skip watering; check drainage after a wet week.');

  if ((r.minTemp48hC ?? 10) >= 6 && ((r.rain48hMm ?? 0) > 5 || (r.soilMoistureMean7 ?? 0) > 0.25)) tasks.push('Lay slug traps or collars for seedlings after dusk.');

  const today = new Date().toISOString().slice(0,10);
  const sow: string[] = []; const trans: string[] = [];
  for (const c of crops) {
    const sch = buildCropSchedule(c, { climateZone: env.climateZone, elevationM: env.elevationM });
    if (!sch) continue;
    sch.windows.forEach(w => {
      if (w.startISO <= today && w.endISO >= today) {
        if (w.label === 'sowOutdoors' || w.label === 'sowIndoors') sow.push(c);
        if (w.label === 'transplant') trans.push(c);
      }
    });
  }
  if (sow.length) tasks.push(`Sow: ${uniq(sow).join(', ')}.`);
  if (trans.length) tasks.push(`Transplant: ${uniq(trans).join(', ')}.`);

  // Sunlight hints
  if (typeof r.sunshineHoursMean7 === 'number') {
    const sun = r.sunshineHoursMean7;
    if (sun < SUN_NEED_PARTIAL) tasks.push(`Light is scarce this week (~${sun.toFixed(1)} h/day). Hold back sun‑lovers; use the brightest bed.`);
    else if (sun >= SUN_NEED_FULL) tasks.push(`Plenty of sun (~${sun.toFixed(1)} h/day). Good for tomatoes, courgettes and beans.`);
  }

  if ((r.rain7dMm ?? 0) > 10) tasks.push('Hoe off small weeds on the next dry afternoon.');

  const uv = env.uvIndex != null ? `UV ~${Math.round(env.uvIndex)}` : undefined;
  const wind = env.weather?.windSpeed != null ? `wind ~${Math.round(env.weather.windSpeed)} km/h` : undefined;
  const rain = r.rain7dMm != null ? `${Math.round(r.rain7dMm)} mm in 7 days` : undefined;
  const sun = typeof r.sunshineHoursMean7 === 'number' ? `${r.sunshineHoursMean7.toFixed(1)} h sunshine/day` : undefined;
  const soil = r.soilMoistureTrend ? `soil moisture ${r.soilMoistureTrend}` : undefined;
  const bits = [uv, wind, rain, sun, soil].filter(Boolean);
  const conditions = bits.length ? bits.join(' • ') : 'Local conditions unavailable';

  return { tasks: tasks.slice(0, 7), conditions };

  function uniq(a: string[]) { return Array.from(new Set(a)); }
}


