name: “WotNow: Gardening (RHS baseline + biodynamic twist)”
version: “1.5”
owner: “Damian”
project_root: “.”
description: >
Add actionable, standards‑first gardening advice to cards using an RHS‑style planting calendar
(offset by climate zone + elevation) and contrast it with live weather, soil data, sunshine, and recent weather history.
Use Stormglass moon phase if available, and append biodynamic notes for fun only.
Elevation is applied as a soil‑first gate, then a lapse‑rate fallback (0.5–0.65 °C per 100 m)
translated into day offsets via the local spring warming slope; a human‑readable reason is shown.

conventions:
british_english: true
moon_phase_source: “Stormglass preferred; fallback to internal phase helper.”
elevation_offset_method: >
1) Primary gate: allow sow/plant when soil_temperature_0cm ≥ crop threshold (default 7 °C; warm‑season crops 10 °C).
2) Fallback: ΔT_alt = elevation_m * 0.005..0.0065 (°C/m). Divide by local warming slope (°C/day),
estimated from the last 21–30 days of Open‑Meteo daily temperature, to get a ±days shift.
Clamp to −10..+21 days; scale to ~65% for cool‑season crops.
weather_sources:
- “OpenWeather (air temp, wind, precip, gusts)”
- “Open‑Meteo (UV, soil temperature/moisture; hourly + daily; DAYLIGHT + SUNSHINE durations; history + archive)”
lookbacks:
soil_history_days: 7
frost_history_years: 5
frost_window: { spring_start: “01-01”, spring_end: “06-30” }
frost_threshold_c: 0
frost_show_window: { before_days: 30, after_days: 14 }
rain48h_mm_compaction: 12
thresholds:
rain_week_dry_mm: 15
rain_week_wet_mm: 35
soil_moisture_wet_m3m3: 0.35
soil_moisture_dry_m3m3: 0.18
seedling_uv_index_warn: 6
cold_soil_c_default: 7
cold_soil_c_warm_lovers: 10
strong_gust_kmh: 55
light_full_sun_h_per_day: 6     # typical horticultural definition of “full sun”
light_partial_sun_h_per_day: 4  # partial sun / light shade
safety_note: “Biodynamic messaging must never block standard, safe horticultural guidance.”

user_stories:
