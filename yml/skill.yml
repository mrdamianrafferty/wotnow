              const d = Math.min(
                min != null ? Math.max(0, (min - value)) : Infinity,
                max != null ? Math.max(0, (value - max)) : Infinity
              );
              return Math.max(0, 1 - 0.2 * d);
            }

            function scoreConditions(env: Env, conditions?: Record<string, Range | Range[]>): number {
              if (!conditions) return 0.5;
              const entries = Object.entries(conditions);
              if (!entries.length) return 0.5;
              const s = entries.map(([metric, constraint]) => {
                const v = env[metric];
                if (Array.isArray(constraint)) {
                  return constraint.reduce((m, r) => Math.max(m, fitsRange(v, r)), 0);
                }
                return fitsRange(v, constraint);
              });
              return s.reduce((a, b) => a + b, 0) / s.length;
            }

            export function scoreAllLevels(env: Env, profile?: SkillProfile) {
              return {
                beginner: scoreConditions(env, profile?.beginner),
                intermediate: scoreConditions(env, profile?.intermediate),
                advanced: scoreConditions(env, profile?.advanced),
              };
            }
      - create_or_update_file:
          file: "${files.skill_messages}"
          content: |
            import { scoreAllLevels } from '@/utils/skillScoring';
            import type { SkillLevel } from '@/data/activityTypes';

            const LABELS: Record<SkillLevel, string> = {
              beginner: 'beginners',
              intermediate: 'intermediate riders',
              advanced: 'advanced riders',
            };

            function bucket(x: number) {
              if (x >= 0.75) return 'great';
              if (x >= 0.55) return 'good';
              if (x >= 0.40) return 'okay';
              return 'challenging';
            }

            export function buildSkillMessage(activity: any, env: Record<string, number | undefined>, selected?: SkillLevel): string | null {
              if (!activity?.skillSensitive || !activity?.skillProfile) return null;
              const s = scoreAllLevels(env, activity.skillProfile);
              const b = bucket(s.beginner);
              const i = bucket(s.intermediate);
              const a = bucket(s.advanced);

              if (selected) {
                const myScore = bucket(s[selected]);
                const contrast =
                  selected === 'beginner'
                    ? (s.advanced > s.beginner + 0.2 ? 'Experts may prefer today.' : 'Experts might find it tame.')
                    : selected === 'advanced'
                      ? (s.beginner + 0.2 < s.advanced ? 'Beginners could struggle today.' : 'Also fine for learners.')
                      : (Math.abs(s.advanced - s.beginner) > 0.2 ? 'Conditions differ for beginners vs experts.' : 'Conditions suit most levels.');
                return `It’s ${myScore} for ${LABELS[selected]}. ${contrast}`;
              }

              const parts: string[] = [];
              if (b === 'great') parts.push('great for beginners');
              else if (b === 'good') parts.push('good for beginners');

              if (i === 'great') parts.push('great for intermediate riders');
              else if (i === 'good') parts.push('good for intermediate riders');

              let tail = '';
              if (a === 'great' || a === 'good') tail = `${a} for advanced riders`;
              else if (a === 'okay') tail = 'advanced riders may find it a bit tame';
              else tail = 'challenging or underwhelming for advanced riders';

              const lead = parts.length ? parts.join(' and ') : 'Mixed conditions';
              return `${lead}, but ${tail}.`;
            }
      - commit:
          message: "feat(skill): add per-skill scoring and message builder"
    success_criteria:
      - "Two new utils exist: skillScoring.ts and skillMessages.ts."
      - "They compile and export as expected."

  - id: phase_3_ui_integration_compare_only
    title: "UI: show comparative message (no selector yet)"
    actions:
      - locate_file_fallback:
          preferred: "${files.card_renderer}"
          fallbacks:
            - "src/components/ActivityListItem.tsx"
            - "src/components/cards/ActivityCard.tsx"
      - ensure_imports:
          file: "${files.card_renderer}"
          imports:
            - "import { buildSkillMessage } from '@/utils/messages/skillMessages';"
      - integrate_message:
          file: "${files.card_renderer}"
          where_to_render: "under the main reasoning/copy block for each activity card"
          code_example: |
            // Construct the minimal environment object from existing metrics resolver
            // (wire actual values you already have available in scope)
            const env = {
              waveHeight, swellPeriod, windSpeed, gust, visibility, temperature, waterTemperature, precipitation
            } as any;

            const skillMsg = buildSkillMessage(activity, env, undefined);
            {skillMsg && <div className="card__hero-reasoning">{skillMsg}</div>}
      - commit:
          message: "feat(ui): show comparative skill message when skillProfile is present"
    success_criteria:
      - "Cards for skill-sensitive activities show an extra comparative line when data is available."
      - "No UI selector required yet."

  - id: phase_4_user_preference_selector
    title: "User preference: Beginner / Intermediate / Advanced"
    optional: true
    actions:
      - create_or_update_file:
          file: "${files.user_prefs}"
          content: |
            export type SkillLevel = 'beginner' | 'intermediate' | 'advanced';
            export interface UserPrefs { skillLevel?: SkillLevel }
            const KEY = 'wotnow:user-prefs';
            export function loadPrefs(): UserPrefs {
              try { return JSON.parse(localStorage.getItem(KEY) || '{}') } catch { return {} }
            }
            export function savePrefs(p: UserPrefs) {
              localStorage.setItem(KEY, JSON.stringify(p));
            }
      - add_selector_ui:
          file: "${files.index_renderer}"
          description: "Add three chips or a small dropdown in the header/preferences area."
          code_example: |
            import React from 'react';
            import { loadPrefs, savePrefs, type SkillLevel } from '@/state/userPrefs';

            const [skill, setSkill] = React.useState<SkillLevel | undefined>(loadPrefs().skillLevel);

            function chooseSkill(s?: SkillLevel) {
              setSkill(s);
              savePrefs({ skillLevel: s });
            }

            // Render three chips: Beginner | Intermediate | Advanced (plus 'All levels')
            // Apply selected value when calling buildSkillMessage(...)
      - thread_selected_into_card:
          file: "${files.card_renderer}"
          description: "Pass the selected skill level to buildSkillMessage(...) if available."
          code_example: |
            const skillMsg = buildSkillMessage(activity, env, selectedSkillLevel);
      - commit:
          message: "feat(prefs): add simple skill-level preference and thread into messages"
    success_criteria:
      - "User can pick a level; message reflects the selection."

  - id: phase_5_ranking_bias
    title: "Optional: bias ranking by selected skill"
    optional: true
    actions:
      - integrate_bias:
          file: "${files.index_renderer}"
          description: "When sorting activities, blend base score with skill score for selected level."
          code_example: |
            import { scoreAllLevels } from '@/utils/skillScoring';
            // ...
            const alpha = 0.4; // weight for skill match
            const s = scoreAllLevels(env, activity.skillProfile);
            const levelScore = selectedSkill ? s[selectedSkill] : 0.5;
            activity.finalScore = 0.6 * activity.baseScore + alpha * levelScore; // adjust weights as needed
      - commit:
          message: "feat(ranking): blend per-skill score into final activity ranking when user selects a level"
    success_criteria:
      - "Sorting reflects chosen skill level without breaking non-skill activities."

quality_gates:
  - "Typescript builds successfully: run `${package_manager} run build`."
  - "ESLint/Prettier (if present) are clean: run `${package_manager} run lint`."
  - "Basic runtime smoke test: start dev server and ensure cards render with comparative copy."
  - "No regressions for non-skill activities (they should behave exactly as before)."

tests:
  strategy: "lightweight integration + snapshot"
  steps:
    - create_dir: "${files.tests_dir}"
    - create_file:
        path: "${files.tests_dir}/skillScoring.test.ts"
        content: |
          import { scoreAllLevels } from '@/utils/skillScoring';

          test('scores surfing small clean waves high for beginners', () => {
            const env = { waveHeight: 0.6, swellPeriod: 9, windSpeed: 4, gust: 6 };
            const profile: any = {
              beginner: { waveHeight: {min: 0.3, max: 1.0}, swellPeriod: {min: 7, max: 11}, windSpeed: {max: 6}, gust: {max: 8} },
              intermediate: { waveHeight: {min: 0.8, max: 2.0}, swellPeriod: {min: 9, max: 14}, windSpeed: {max: 8}, gust: {max: 12} },
              advanced: { waveHeight: {min: 1.5, max: 3.5}, swellPeriod: {min: 11, max: 18}, windSpeed: {max: 10}, gust: {max: 14} },
            };
            const s = scoreAllLevels(env, profile);
            expect(s.beginner).toBeGreaterThan(s.advanced);
          });
    - npm_script_hint: "If you use Vitest/Jest, add a script `test` and run it."

rollbacks:
  - if_build_fails:
      revert_last_commit: true
      message: "revert(skill): rollback failed skill-aware change"
  - if_runtime_errors:
      stash_changes_and_open_pr: true

commit_style:
  type_scope_subject: true
  examples:
    - "feat(skill): add per-skill scoring and message builder"
    - "feat(ui): show comparative skill message on activity cards"
    - "feat(prefs): add skill-level selector and wire into messages"
    - "feat(ranking): blend skill score into sorting when selected"
    - "test(skill): add unit test for surfing beginner conditions"

acceptance_criteria:
  - "For surfing with ~0.6 m, 9–10 s, light wind: message says beginners great, advanced maybe tame."
  - "For sailing in fresh breeze: message cautions beginners, but good/exciting for experienced crew."
  - "For non-skill activities (e.g., football): no change in copy."
  - "Selector (if enabled) persists to local storage and updates messages immediately."

# ────────────────────────────────────────────────────────────────────────────────
agent_capabilities:
  description: "Concrete capabilities the agent must possess to execute all phases end-to-end."
  must_support:
    - Run shell commands (Node/TS toolchain)
    - Search and modify repository files (glob + AST-safe TS edits preferred)
    - Create, patch, and commit files with conventional commits
    - Start a local dev server and capture build output
    - Parse TypeScript types and verify exported symbols
    - Execute unit tests (Jest/Vitest) and capture results
    - Read and write JSON/YAML (for config and fixtures)
    - Perform guarded text replacements with idempotency
    - Post concise progress notes and surface diffs on failure

preconditions:
  - Ensure Node version satisfies `defaults.node_version` (use `nvm use` if available)
  - If `package-lock.json` or `pnpm-lock.yaml` exists, respect the repo's package manager; otherwise use `${defaults.package_manager}`
  - Install dependencies: `${defaults.package_manager} install`
  - Verify TypeScript is present; if missing, install dev deps: `typescript`, `ts-node`, and a test runner (Jest or Vitest)
  - Detect path aliases from `tsconfig.json` (e.g., `@/`) and use them in imports

repo_discovery:
  strategies:
    - Prefer paths under `conventions.files`; if not found, search the repo for filenames or key symbols
    - When multiple candidates are found, choose the one imported elsewhere the most (basic grep count)
    - If a path is still ambiguous, write a brief note into the run log and pick the highest-confidence match

environment:
  required_dev_dependencies:
    - typescript
    - ts-node
    - @types/node
    - jest # or vitest; agent may pick one if none present
  optional_dev_dependencies:
    - eslint
    - prettier
    - ts-jest
  scripts_hints:
    build: "tsc -p ${defaults.tsconfig}"
    test: "jest --passWithNoTests"

# Data the agent may need to fabricate for testing without live weather
mock_data:
  env_examples:
    calm_sea_day:
      waveHeight: 0.5
      swellPeriod: 9
      windSpeed: 4
      gust: 6
      waterTemperature: 20
      visibility: 6
      temperature: 18
      precipitation: 0
    windy_day:
      waveHeight: 1.2
      swellPeriod: 7
      windSpeed: 18
      gust: 25
      waterTemperature: 16
      visibility: 5
      temperature: 14
      precipitation: 2

# Normalise metric names so different sources map into the scorer cleanly
metric_dictionary:
  description: "Canonical metric keys used by skill scoring."
  canonical_keys:
    - waveHeight        # metres
    - swellPeriod       # seconds
    - windSpeed         # m/s (land/marine must be consistent before scoring)
    - gust              # m/s
    - waterTemperature  # °C
    - temperature       # °C
    - precipitation     # mm/h (or mm over interval)
    - visibility        # km
  guidance:
    - Resolver functions must convert provider units to the canonical units above
    - Missing metrics should be set to `undefined`; the scorer handles them gracefully

metrics_mapping_guidance:
  - "If your existing env resolver exposes OpenWeather `wind.speed` in m/s and Stormglass `windSpeed` in m/s, pass-through is fine."
  - "If any data is in km/h or knots, convert before scoring: m/s = km/h ÷ 3.6; m/s = knots × 0.514444."
  - "Water temp is optional for non-marine activities; leave undefined to avoid misleading penalties."

telemetry:
  events:
    - skill_message_rendered: { activityId: string, level?: string, beginner: number, intermediate: number, advanced: number }
    - skill_profile_missing: { activityId: string }
    - skill_env_missing_metrics: { activityId: string, missing: string[] }
  logging_guidelines:
    - Do not log raw user PII
    - Redact precise coordinates; keep only region-level tags if needed

feature_flags:
  - key: skill.compare_only
    default: true
    description: "Only display comparative copy; do not alter ranking"
  - key: skill.selector_enabled
    default: false
    description: "Expose Beginner/Intermediate/Advanced selector in UI"
  - key: skill.bias_ranking
    default: false
    description: "Blend skill score into final ranking when selector is on"

rollout_plan:
  phases:
    - name: "Canary"
      audience: "5% of sessions"
      flags: { skill.compare_only: true, skill.selector_enabled: false, skill.bias_ranking: false }
      success_criteria: ["No runtime errors", "Crash-free sessions > 99.5%", "UI renders skill lines where expected"]
    - name: "Selector"
      audience: "25% of sessions"
      flags: { skill.compare_only: true, skill.selector_enabled: true, skill.bias_ranking: false }
      success_criteria: ["Selector interaction rate > 20%", "No uplift in bounce"]
    - name: "Bias"
      audience: "50% of sessions"
      flags: { skill.compare_only: false, skill.selector_enabled: true, skill.bias_ranking: true }
      success_criteria: ["Meaningful change in activity clicks aligned with chosen level"]

edge_cases:
  - "No metrics available for an activity: suppress skill message silently"
  - "Partial metrics: compute scores on available keys only"
  - "Conflicting units: convert before scoring; never mix"
  - "Activities mislabelled as skill-sensitive: guard with `activity.skillSensitive` and presence of `skillProfile`"
  - "Marine activities without beach orientation: don't penalise; leave orientation out of env"

failure_modes_and_recoveries:
  - mode: "TypeScript compile error after patch"
    recover: "Revert the last commit and open a PR with diff; leave notes in run log"
  - mode: "Paths not found"
    recover: "Search repo; if still ambiguous, write chosen path and rationale to run log"
  - mode: "Tests failing"
    recover: "Run only new tests to isolate regression; if unrelated tests fail, tag as pre-existing and proceed with warning"

ci_notes:
  - "If a CI pipeline exists, the agent should open a branch `feat/skill-aware` and push incremental commits"
  - "Attach a short summary of changed files and acceptance criteria checks to the PR body"

developer_experience:
  readme_snippet: |
    ### Skill-aware activities (preview)
    * Compare suitability for beginners/intermediate/advanced without changing rankings (Phase 1–3)
    * Optional selector + ranking bias (Phase 4–5)
    * All thresholds are **advisory**, not safety guidance

idempotency:
  rules:
    - Patches must be re-runnable: check for existing imports/exports before inserting
    - Never duplicate exports or interfaces; verify symbol presence by regex before writing
    - Commits use conventional messages as defined in `commit_style`
