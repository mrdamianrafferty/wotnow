apply plugin: 'com.android.application'

// Read versions from centralized config
def versionsFile = file("../../app-versions.json")
def versions = new groovy.json.JsonSlurper().parse(versionsFile)

android {
    namespace "app.wotnow.base"  // Base namespace for shared code
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        findrRelease {
            def keystorePath = System.getenv("FINDR_KEYSTORE_PATH")
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("FINDR_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FINDR_KEY_ALIAS")
                keyPassword System.getenv("FINDR_KEY_PASSWORD")
            }
        }
        godaisyRelease {
            def keystorePath = System.getenv("GODAISY_KEYSTORE_PATH")
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("GODAISY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GODAISY_KEY_ALIAS")
                keyPassword System.getenv("GODAISY_KEY_PASSWORD")
            }
        }
        growdaisyRelease {
            def keystorePath = System.getenv("GROWDAISY_KEYSTORE_PATH")
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("GROWDAISY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GROWDAISY_KEY_ALIAS")
                keyPassword System.getenv("GROWDAISY_KEY_PASSWORD")
            }
        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        findr {
            dimension "app"
            applicationId "eu.fishfindr.app"
            versionCode versions.findr.versionCode
            versionName versions.findr.versionName
            resValue "string", "app_name", "Findr"
            resValue "string", "server_url", "https://fishfindr.eu"
            resValue "string", "deep_link_scheme", "fishfindr"
            buildConfigField "String", "SERVER_URL", "\"https://fishfindr.eu\""
            manifestPlaceholders = [
                deepLinkScheme: "fishfindr",
                deepLinkHost: "fishfindr.eu"
            ]
        }

        godaisy {
            dimension "app"
            applicationId "io.godaisy.app"
            versionCode versions.godaisy.versionCode
            versionName versions.godaisy.versionName
            resValue "string", "app_name", "Go Daisy"
            resValue "string", "server_url", "https://godaisy.io"
            resValue "string", "deep_link_scheme", "godaisy"
            buildConfigField "String", "SERVER_URL", "\"https://godaisy.io\""
            manifestPlaceholders = [
                deepLinkScheme: "godaisy",
                deepLinkHost: "godaisy.io"
            ]
        }

        growdaisy {
            dimension "app"
            applicationId "io.growdaisy.app"
            versionCode versions.growdaisy.versionCode
            versionName versions.growdaisy.versionName
            resValue "string", "app_name", "Grow Daisy"
            resValue "string", "server_url", "https://grow.godaisy.io"
            resValue "string", "deep_link_scheme", "growdaisy"
            buildConfigField "String", "SERVER_URL", "\"https://grow.godaisy.io\""
            manifestPlaceholders = [
                deepLinkScheme: "growdaisy",
                deepLinkHost: "grow.godaisy.io"
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Apply signing configs to release builds per flavor
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            def flavorName = variant.productFlavors[0].name
            def signingConfigName = "${flavorName}Release"
            def signingConfig = signingConfigs.findByName(signingConfigName)
            if (signingConfig?.storeFile != null) {
                variant.signingConfig = signingConfig
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Firebase for push notifications
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
