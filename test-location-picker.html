<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Picker Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .warning { background-color: #fff3cd; border: 1px solid #ffeaa7; }
        button { margin: 5px; padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WotNow Location Picker Test</h1>
    
    <h2>Geolocation Test</h2>
    <button onclick="testGeolocation()">Test Geolocation</button>
    <div id="geolocation-result"></div>
    
    <h2>Network Test</h2>
    <button onclick="testNetworkAPI()">Test API Access</button>
    <div id="network-result"></div>
    
    <h2>Google Maps API Test</h2>
    <button onclick="testGoogleMaps()">Test Google Maps API</button>
    <div id="googlemaps-result"></div>
    
    <h2>OpenWeather Geocoding Test</h2>
    <input type="text" id="search-input" placeholder="Enter location to search" style="width: 300px; padding: 8px;">
    <button onclick="testOpenWeatherSearch()">Search Location</button>
    <div id="openweather-result"></div>

    <script>
        // Test geolocation
        function testGeolocation() {
            const resultDiv = document.getElementById('geolocation-result');
            resultDiv.innerHTML = '<div class="test-result warning">Testing geolocation...</div>';
            
            if (!navigator.geolocation) {
                resultDiv.innerHTML = '<div class="test-result error">❌ Geolocation not supported</div>';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const { latitude, longitude, accuracy } = position.coords;
                    resultDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Geolocation successful<br>
                            📍 Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}<br>
                            🎯 Accuracy: ${accuracy}m
                        </div>
                    `;
                },
                function(error) {
                    let errorMsg = 'Unknown error';
                    switch(error.code) {
                        case 1: errorMsg = 'Permission denied'; break;
                        case 2: errorMsg = 'Position unavailable (kCLErrorLocationUnknown)'; break;
                        case 3: errorMsg = 'Timeout'; break;
                    }
                    resultDiv.innerHTML = `
                        <div class="test-result error">
                            ❌ Geolocation failed<br>
                            Error code: ${error.code} - ${errorMsg}<br>
                            Message: ${error.message}
                        </div>
                    `;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
        
        // Test network/API access
        async function testNetworkAPI() {
            const resultDiv = document.getElementById('network-result');
            resultDiv.innerHTML = '<div class="test-result warning">Testing API access...</div>';
            
            try {
                // Test basic network connectivity
                const response = await fetch('https://api.openweathermap.org/geo/1.0/direct?q=London&limit=1&appid=test');
                
                if (response.status === 401) {
                    resultDiv.innerHTML = '<div class="test-result success">✅ Network and API endpoint accessible (401 expected without valid key)</div>';
                } else {
                    resultDiv.innerHTML = `<div class="test-result warning">⚠️ Unexpected response status: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Network error<br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // Test Google Maps API
        function testGoogleMaps() {
            const resultDiv = document.getElementById('googlemaps-result');
            
            if (typeof google === 'undefined') {
                resultDiv.innerHTML = '<div class="test-result error">❌ Google Maps API not loaded</div>';
                return;
            }
            
            let result = '<div class="test-result success">✅ Google Maps API loaded<br>';
            
            if (typeof google.maps.places !== 'undefined') {
                result += '✅ Places library available<br>';
                
                if (typeof google.maps.places.AutocompleteService !== 'undefined') {
                    result += '⚠️ AutocompleteService available (deprecated)<br>';
                }
                
                if (typeof google.maps.places.AutocompleteSuggestion !== 'undefined') {
                    result += '✅ AutocompleteSuggestion available (recommended)<br>';
                } else {
                    result += '❌ AutocompleteSuggestion not available<br>';
                }
            } else {
                result += '❌ Places library not available<br>';
            }
            
            result += '</div>';
            resultDiv.innerHTML = result;
        }
        
        // Test OpenWeather geocoding
        async function testOpenWeatherSearch() {
            const resultDiv = document.getElementById('openweather-result');
            const query = document.getElementById('search-input').value.trim();
            
            if (!query) {
                resultDiv.innerHTML = '<div class="test-result warning">Please enter a location to search</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="test-result warning">Searching...</div>';
            
            try {
                // Note: Using a placeholder API key - in real app this would come from env
                const apiKey = 'test_key'; // This will fail but we can test the endpoint
                const response = await fetch(
                    `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(query)}&limit=5&appid=${apiKey}`
                );
                
                if (response.status === 401) {
                    resultDiv.innerHTML = '<div class="test-result success">✅ OpenWeather API endpoint accessible (requires valid API key for actual search)</div>';
                } else if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Search successful<br>
                            Found ${data.length} locations
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="test-result error">❌ API error: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Search failed<br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // Auto-run some tests
        window.addEventListener('load', function() {
            setTimeout(() => {
                testNetworkAPI();
                testGoogleMaps();
            }, 1000);
        });
    </script>
</body>
</html>
