  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGradient)"/>

  <!-- Sprout icon (scaled and centered from Lucide's 24x24 viewBox) -->
