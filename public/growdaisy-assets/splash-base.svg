    <path d="M5 21h14"/>
  </g>

  <!-- App name text -->
  <text x="1366" y="1650" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="600" fill="white" text-anchor="middle">Grow Daisy</text>
</svg>
