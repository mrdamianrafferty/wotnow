<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Test</title>
</head>
<body>
    <h1>Geolocation Test</h1>
    <button id="getLocation">Get Current Location</button>
    <div id="result"></div>
    <div id="error" style="color: red;"></div>

    <script>
        document.getElementById('getLocation').addEventListener('click', function() {
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            
            // Clear previous results
            resultDiv.innerHTML = 'Getting location...';
            errorDiv.innerHTML = '';
            
            if (!navigator.geolocation) {
                errorDiv.innerHTML = 'Geolocation is not supported by this browser.';
                resultDiv.innerHTML = '';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    resultDiv.innerHTML = `
                        <h3>Location Found:</h3>
                        <p>Latitude: ${lat}</p>
                        <p>Longitude: ${lon}</p>
                        <p>Accuracy: ${accuracy} meters</p>
                        <p>Timestamp: ${new Date(position.timestamp)}</p>
                    `;
                },
                function(error) {
                    let errorMessage = 'An unknown error occurred.';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = 'User denied the request for Geolocation.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = 'Location information is unavailable. (Error code 2: kCLErrorLocationUnknown)';
                            break;
                        case error.TIMEOUT:
                            errorMessage = 'The request to get user location timed out.';
                            break;
                    }
                    
                    errorDiv.innerHTML = `
                        <h3>Geolocation Error:</h3>
                        <p>Error Code: ${error.code}</p>
                        <p>Message: ${errorMessage}</p>
                        <p>Details: ${error.message}</p>
                    `;
                    resultDiv.innerHTML = '';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>
