<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Findr - Fish Predictions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111827;
      --bg-card: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --cyan: #0ea5e9;
      --cyan-dim: rgba(14, 165, 233, 0.1);
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Loading State */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .spinner {
      border: 4px solid var(--cyan-dim);
      border-top: 4px solid var(--cyan);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 svg {
      color: var(--cyan);
    }

    .offline-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--yellow);
      color: #000;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .online-badge {
      background: var(--green);
    }

    /* Staleness Banner */
    .staleness-banner {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--yellow);
    }

    /* Prediction Cards */
    .predictions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .predictions-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .location-name {
      color: var(--cyan);
      font-size: 14px;
    }

    .prediction-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fish-icon {
      width: 56px;
      height: 56px;
      background: var(--cyan-dim);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .fish-icon svg {
      width: 32px;
      height: 32px;
      color: var(--cyan);
    }

    .prediction-info {
      flex: 1;
      min-width: 0;
    }

    .species-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .species-scientific {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 6px;
    }

    .confidence-bar {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .confidence-high { background: var(--green); }
    .confidence-medium { background: var(--yellow); }
    .confidence-low { background: var(--red); }

    .confidence-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--cyan);
      color: white;
    }

    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
    }

    /* Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-around;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--cyan);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      background: var(--bg-card);
      color: var(--text-muted);
      border: none;
      cursor: pointer;
    }

    .tab.active {
      background: var(--cyan);
      color: white;
    }

    /* Hidden */
    .hidden { display: none !important; }

    /* Content area with bottom nav spacing */
    .content {
      padding-bottom: 80px;
    }
  </style>
</head>
<body>
  <!-- Loading State -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Findr</div>
    <div style="color: var(--text-muted);">Loading predictions...</div>
  </div>

  <!-- Offline App -->
  <div id="app" class="hidden">
    <div class="container content">
      <!-- Header -->
      <div class="header">
        <h1>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
            <circle cx="15" cy="12" r="2"/>
            <path d="M2 12s2-2 4-2"/>
          </svg>
          Findr
        </h1>
        <div id="connection-badge" class="offline-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="2" y1="2" x2="22" y2="22"/>
            <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
            <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
            <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
            <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
            <path d="M5 13a10 10 0 0 1 5.24-2.76"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
          <span id="connection-text">Offline</span>
        </div>
      </div>

      <!-- Staleness Banner -->
      <div id="staleness-banner" class="staleness-banner hidden">
        <strong>Offline Mode:</strong> Showing cached predictions from <span id="cache-time">earlier</span>. Connect to internet for fresh data.
      </div>

      <!-- Predictions Section -->
      <div class="predictions-header">
        <h2>Top Predictions</h2>
        <span id="location-display" class="location-name"></span>
      </div>

      <!-- Predictions List -->
      <div id="predictions-list"></div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
          <circle cx="15" cy="12" r="2"/>
          <path d="M2 12s2-2 4-2"/>
        </svg>
        <h3>No Cached Predictions</h3>
        <p>Open Findr when online to cache predictions for offline use.</p>
        <button class="btn btn-primary" onclick="tryOnline()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
          Try to Connect
        </button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="showTab('predictions')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
          <circle cx="15" cy="12" r="2"/>
        </svg>
        Predictions
      </button>
      <button class="nav-item" onclick="showTab('favorites')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        Favorites
      </button>
      <button class="nav-item" onclick="showTab('catches')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Log
      </button>
    </nav>
  </div>

  <script>
    // IndexedDB for cached data
    const DB_NAME = 'findr-offline';
    const DB_VERSION = 1;
    let db = null;

    // Initialize
    async function init() {
      console.log('[Findr Offline] Initializing...');

      // Check if we're online
      if (navigator.onLine) {
        console.log('[Findr Offline] Online - redirecting to main app');
        // Small delay to show loading, then redirect
        setTimeout(() => {
          window.location.href = 'https://fishfindr.eu/findr';
        }, 500);
        return;
      }

      console.log('[Findr Offline] Offline mode - loading cached data');

      // We're offline - show the offline app
      try {
        await openDatabase();
        await loadCachedData();
        showApp();
      } catch (error) {
        console.error('[Findr Offline] Error:', error);
        showApp();
        showEmptyState();
      }

      // Listen for online/offline events
      window.addEventListener('online', handleOnline);
      window.addEventListener('offline', handleOffline);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        // Try to open the existing Findr database
        const request = indexedDB.open('findr-offline', 1);

        request.onerror = () => {
          console.warn('[Findr Offline] Could not open database');
          reject(request.error);
        };

        request.onsuccess = () => {
          db = request.result;
          console.log('[Findr Offline] Database opened');
          resolve(db);
        };

        request.onupgradeneeded = (event) => {
          // If we're creating a new DB, that means no cached data exists
          console.log('[Findr Offline] No existing cache found');
        };
      });
    }

    async function loadCachedData() {
      if (!db) {
        showEmptyState();
        return;
      }

      try {
        // Try to get predictions from cache
        const rawPredictions = await getFromStore('predictions');
        const species = await getFromStore('species');

        if (rawPredictions && rawPredictions.length > 0) {
          // Sort by timestamp (most recent first) and get the latest prediction
          rawPredictions.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

          // Get the prediction data - could be nested in .data property
          const latestRaw = rawPredictions[0];
          const predictionData = latestRaw.data || latestRaw;

          // Extract predictions array from response structure
          let predictions = [];
          if (predictionData.predictions) {
            predictions = predictionData.predictions;
          } else if (predictionData.data?.predictions) {
            predictions = predictionData.data.predictions;
          } else if (Array.isArray(predictionData)) {
            predictions = predictionData;
          }

          if (predictions.length > 0) {
            // Add rectangle code from the cache key
            predictions = predictions.map(p => ({
              ...p,
              rectangleCode: latestRaw.rectangleCode || p.rectangleCode
            }));

            renderPredictions(predictions, species);

            // Show staleness banner
            const cacheTime = latestRaw.timestamp;
            if (cacheTime) {
              showStalenessBanner(new Date(cacheTime));
            }
          } else {
            showEmptyState();
          }
        } else {
          showEmptyState();
        }
      } catch (error) {
        console.error('[Findr Offline] Error loading cache:', error);
        showEmptyState();
      }
    }

    function getFromStore(storeName) {
      return new Promise((resolve, reject) => {
        if (!db || !db.objectStoreNames.contains(storeName)) {
          resolve([]);
          return;
        }

        const transaction = db.transaction(storeName, 'readonly');
        const store = transaction.objectStore(storeName);
        const request = store.getAll();

        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    function renderPredictions(predictions, speciesMap) {
      const container = document.getElementById('predictions-list');
      container.innerHTML = '';

      // Get the location from the first prediction
      if (predictions[0]?.rectangleCode) {
        document.getElementById('location-display').textContent = predictions[0].rectangleCode;
      }

      // Render top 10 predictions
      const topPredictions = predictions.slice(0, 10);

      topPredictions.forEach(pred => {
        // Handle different confidence field names from API
        const confidence = pred.confidence_percent || pred.confidence || pred.score || 50;
        const confidenceClass = confidence >= 70 ? 'confidence-high' :
                               confidence >= 40 ? 'confidence-medium' : 'confidence-low';

        // Handle different species name field names
        const speciesName = pred.species_common_name || pred.name_en || pred.species_name || pred.commonName || pred.species || 'Unknown Species';
        const scientificName = pred.species_scientific_name || pred.scientific_name || pred.scientificName || '';

        const card = document.createElement('div');
        card.className = 'prediction-card';
        card.innerHTML = `
          <div class="fish-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
              <circle cx="15" cy="12" r="2"/>
              <path d="M2 12s2-2 4-2"/>
            </svg>
          </div>
          <div class="prediction-info">
            <div class="species-name">${speciesName}</div>
            <div class="species-scientific">${scientificName}</div>
            <div class="confidence-bar">
              <div class="confidence-fill ${confidenceClass}" style="width: ${confidence}%"></div>
            </div>
            <div class="confidence-label">${Math.round(confidence)}% match</div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('empty-state').classList.add('hidden');
    }

    function showStalenessBanner(cacheDate) {
      const banner = document.getElementById('staleness-banner');
      const timeSpan = document.getElementById('cache-time');

      const now = new Date();
      const diff = now - cacheDate;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

      if (hours > 0) {
        timeSpan.textContent = `${hours}h ${minutes}m ago`;
      } else {
        timeSpan.textContent = `${minutes}m ago`;
      }

      banner.classList.remove('hidden');
    }

    function showEmptyState() {
      document.getElementById('predictions-list').innerHTML = '';
      document.getElementById('empty-state').classList.remove('hidden');
    }

    function showApp() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    function handleOnline() {
      console.log('[Findr Offline] Back online!');
      const badge = document.getElementById('connection-badge');
      const text = document.getElementById('connection-text');
      badge.classList.add('online-badge');
      text.textContent = 'Online';

      // Redirect to main app after a moment
      setTimeout(() => {
        window.location.href = 'https://fishfindr.eu/findr';
      }, 1500);
    }

    function handleOffline() {
      console.log('[Findr Offline] Gone offline');
      const badge = document.getElementById('connection-badge');
      const text = document.getElementById('connection-text');
      badge.classList.remove('online-badge');
      text.textContent = 'Offline';
    }

    function tryOnline() {
      if (navigator.onLine) {
        window.location.href = 'https://fishfindr.eu/findr';
      } else {
        alert('Still offline. Please check your internet connection.');
      }
    }

    function showTab(tab) {
      // Update nav items
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // For now just show a message for non-predictions tabs
      if (tab !== 'predictions') {
        alert('This feature requires cached data. Use Findr online first to cache your favorites and catch log.');
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
