version: 2
name: wotnow_sharing_agent
description: >
  Plan, generate, and distribute highly shareable invites. For indoor/non-weather
  activities: optimise fast venue decisions, low-friction shares, and appealing
  previews across chat apps. For outdoor/weather-sensitive activities: create
  persuasive, data-backed condition cards with one-tap RSVP, ICS/webcal options,
  and live “check conditions” links. Always include growth hooks (branding, CTAs,
  attribution, referral tags, and post-action upsell). Use localised venue search
  (country language first, English fallback) to surface relevant places by activity.

# ────────────────────────────────────────────────────────────────────────────────
objectives:
  - Increase invites sent per active user
  - Increase join conversions (clicked invite → directions or calendar add)
  - Keep privacy-first; never share exact origins
  - Drive brand awareness via share attribution
  - Increase WotNow sign-ups

success_metrics:
  invites_per_user_daily: ">= 1.3"
  join_conversion_rate: ">= 35%"
  time_to_decision_minutes: "<= 30"
  cost_per_invite_usd: "<= 0.01"

# ────────────────────────────────────────────────────────────────────────────────
triggers:
  - event: user_opens_activity
    condition: activity.weatherSensitive == false
    action: propose_invite_flow
  - event: user_clicks_share
    action: build_and_share_invite
  - event: user_adds_multiple_venues
    action: create_poll  # optional; can be feature-flagged

# ────────────────────────────────────────────────────────────────────────────────
inputs:
  user_profile:
    - user_id
    - display_name
    - locale              # e.g., en-GB, es-ES
    - preferred_language
    - accessibility_needs # e.g., step-free
  activity_context:
    - activity_id
    - activity_name
    - default_duration_mins
    - share_copy_template_ids
    - weatherSensitive: boolean
  location_context:
    - chosen_neighbourhood?   # optional
    - last_used_places?       # cached placeIds
  device_capabilities:
    - web_share_api: boolean
    - can_create_files: boolean     # .ics
    - can_open_deeplinks: boolean
  permissions:
    - approximate_location_allowed: boolean
    - notifications_allowed: boolean

# ────────────────────────────────────────────────────────────────────────────────
tools:
  # Google Places / Maps
  places_search:        # Nearby Search with a single phrase keyword
    params: [keyword, type, lat, lng, rankby?, radius?, opennow?, language?]
  places_text_search:   # Fallback Text Search
    params: [query, lat, lng, radius?, language?]
  place_details:        # name, address, lat, lng, photos, opening hours, rating, price_level, url
    params: [place_id]

  static_map_url:       # sharable map image for OG
    params: [lat, lng, zoom, size]

  distance_matrix:      # optional; only if user consents to share approximate origin
    params: [origins[], destinations[]]

  # Link & calendar
  shortlink_create:
    params: [long_url, campaign, tags[]]
  link_sign:
    params: [payload_json]
  calendar_ics_create:
    params: [title, start_iso, end_iso, description, location_text, url, geo_lat?, geo_lng?, categories?, apple_structured_location?, valarm_trigger?]
  webcal_url_create:
    params: [invite_id]

  # Notifications / UI / Clipboard
  notifications:
    - schedule_local: [title, body, fire_at_iso]
    - push_opt_in_prompt: []
  clipboard_copy:
    params: [text]
  ui:
    - toggle: [label, default]

  # Secrets
  secrets:
    - maps_server_key
    - maps_browser_key

  # Lightweight reverse geocode via OpenWeather (only if country not already known)
  openweather_reverse_geocode:
    params: [lat, lng, limit=1]

  # Analytics
  analytics_log:
    params: [event_name, props]

# ────────────────────────────────────────────────────────────────────────────────
helpers:
  # Emoji dictionary for condition bullets (British English where relevant)
  emoji_bullets:
    wave: "🌊"
    swell: "🌊"
    wind: "💨"
    gust: "💨"
    temperature: "🌡️"
    heat: "🌡️"
    sunshine: "☀️"
    sun: "☀️"
    uv: "🌞"
    clouds: "☁️"
    cloud: "☁️"
    rain: "🌧️"
    drizzle: "🌦️"
    thunder: "⛈️"
    snow: "❄️"
    ice: "🧊"
    visibility: "👀"
    fog: "🌫️"
    tide: "🌊↕️"
    safety: "🛟"
    warning: "⚠️"
    fun: "🎉"
    fitness: "💪"
    air_quality: "🌬️"
    pollen: "🌾"

  activity_emoji:
    surfing: "🏄"
    bodyboarding: "🤙"
    kayaking: "🛶"
    sea_kayaking: "🛶"
    stand_up_paddleboarding: "🏄‍♂️"
    sup_sea: "🏄‍♂️"
    snorkeling: "🤿"
    scuba_diving: "🤿"
    sailing: "⛵"
    fishing: "🎣"
    hiking: "🥾"
    running: "🏃"
    cycling: "🚴"
    mountain_biking: "🚵"
    football: "⚽"
    climbing: "🧗"
    bouldering: "🧗"
    yoga: "🧘"
    gym: "🏋️"
    skiing: "🎿"
    snowboarding: "🏂"
    museum: "🏛️"
    gallery: "🖼️"
    cinema: "🎬"
    cafe: "☕"
    going_to_pub: "🍺"

  # Annotate reasons with emojis
  emoji_reasons:
    inputs: [reasons, max?]
    logic:
      - "list := []"
      - "for r in reasons:"
      - "  k := find_first_key(r, keys(emoji_bullets))"
      - "  list.push( (k ? emoji_bullets[k] : '•') + ' ' + r )"
      - "return max ? list.slice(0,max) : list"

  reasons_line:
    inputs: [reasons, max?]
    logic:
      - "arr := call helpers.emoji_reasons with { reasons, max }"
      - "return join(arr, ' • ')"

  emoji_for:
    inputs: [activity_id]
    logic:
      - "e := activity_emoji[activity_id]"
      - "return e ?? ''"

  # ── Localisation + keywords (runtime loads ACTIVITY_KEYWORDS externally) ──
  map_country_to_lang:
    inputs: [country]
    logic:
      - "cc := upper(country)"
      - "return {
            ES:'es', MX:'es', AR:'es', CL:'es', CO:'es', PE:'es',
            FR:'fr', BE:'fr', CA:'fr',
            DE:'de', AT:'de', CH:'de',
            IT:'it', PT:'pt', BR:'pt',
            CN:'zh', HK:'zh', MO:'zh', TW:'zh',
            JP:'ja'
          }[cc] ?? 'en'"

  keyword_pack:
    docs: "Return ordered, deduped phrase list for activity_id in language, then English."
    inputs: [activity_id, language]
    logic:
      - "base := ACTIVITY_KEYWORDS[activity_id][language] ?? []"
      - "en   := ACTIVITY_KEYWORDS[activity_id]['en'] ?? []"
      - "return dedupe_preserve_order(trim_all(base + en))"

  suggested_type:
    docs: "Return broad, safe Places type per activity; fall back to 'establishment'."
    inputs: [activity_id]
    logic:
      - "map := {
            pilates:'gym', yoga:'gym', gym_workout:'gym', climbing_gym:'gym',
            tennis:'park', padel:'gym', squash:'gym', badminton:'gym',
            table_tennis:'gym', pickleball:'park', volleyball_indoor:'gym',
            cinema:'movie_theater', museum:'museum', gallery:'art_gallery',
            cafe:'cafe', going_to_pub:'bar', shopping:'establishment',
            hiking:'park', running:'park', cycling:'cafe',
            mountain_biking:'park', skateboarding:'park', rollerblading:'park',
            picnicking:'park', bbq:'park',
            kayaking:'tourist_attraction', sea_kayaking:'tourist_attraction',
            canoeing:'tourist_attraction', stand_up_paddleboarding:'tourist_attraction',
            surfing:'tourist_attraction', windsurfing:'tourist_attraction',
            kitesurfing:'tourist_attraction', snorkeling:'tourist_attraction',
            scuba_diving:'tourist_attraction', wild_swimming:'natural_feature',
            sailing:'marina', sailing_inland:'marina', jetskiing:'tourist_attraction',
            fishing:'tourist_attraction', fly_fishing_freshwater:'natural_feature',
            coarse_fishing:'natural_feature', sea_fishing_shore:'tourist_attraction',
            sea_fishing_boat:'tourist_attraction', ice_fishing:'natural_feature'
          }"
      - "return map[activity_id] ?? 'establishment'"

  venue_search_localised:
    docs: >
      Given activity_id and coords, pick the country language (from state if present,
      else reverse geocode via OpenWeather). Pull localised keywords for that activity
      (local first, English fallback). Try Nearby Search phrase-by-phrase; if none,
      fall back to Text Search with the first phrase + “near me”.

    inputs: [activity_id, lat, lng, country_from_state?, open_now?, radius_m?]
    outputs: [candidates, tried_log[]]
    logic:
      - "country := country_from_state ?? call openweather_reverse_geocode(lat,lng,1).country ?? 'EN'"
      - "lang := map_country_to_lang(country)"
      - "phrases := keyword_pack(activity_id, lang)"
      - "type := suggested_type(activity_id)"
      - "rankby := (type in ['park','tourist_attraction']) ? 'distance' : null"
      - "radius := rankby ? null : (radius_m ?? 7000)"
      - "tried_log := []"
      - "n_tries := 0"
      - "for p in phrases:"
      - "  if n_tries >= policy.rate_limits.sequential_keyword_tries_max: break"
      - "  params := { keyword:p, type, lat, lng, language:lang }"
      - "  if rankby: params.rankby='distance' else: params.radius=radius"
      - "  if open_now?: params.opennow=true"
      - "  res := call places_search with params"
      - "  append(tried_log, {endpoint:'nearby', lang, phrase:p, count:len(res.results)})"
      - "  n_tries := n_tries + 1"
      - "  if len(res.results) > 0: return { candidates: res.results, tried_log }"
      - "# Fallback: Text Search with the first phrase"
      - "res_text := call places_text_search(query=phrases[0] + ' near me', lat, lng, radius=(radius_m ?? 7000), language=lang)"
      - "append(tried_log, {endpoint:'text', lang, phrase:phrases[0], count:len(res_text.results)})"
      - "return { candidates: res_text.results, tried_log }"

# ────────────────────────────────────────────────────────────────────────────────
policy:
  privacy:
    - Never include users’ exact origin in shared URLs.
  localisation:
    date_format: "locale"
    currency_symbol: "€ by region, fallback £/$"
    spelling: "British English"
    venue_search_language: "Prefer language inferred from country of coordinates; fallback to English."
  accessibility:
    - Ensure text alternatives for map images.
    - Promote step-free venues when any voter flags need.
  rate_limits:
    places_search_per_min: 8
    sequential_keyword_tries_max: 5
  cost_controls:
    - Use Place Details on selection, not per keystroke.
    - Use Static Maps for shares; render live maps lazily.
  result_quality:
    min_rating: 3.8
    exclude_if:
      - "price_level: null AND rating_count < 5"
  preview_constraints:
    og_title_max_chars: 60
    og_desc_max_chars: 90
    og_image_min_size: "1200x630"
    whatsapp_line_breaks_ok: true
  link_security:
    signed_links: true
    link_expiry_days: 14
  attribution:
    use_per_recipient_tokens: true
    token_payload: [invite_id?, sharer_id, recipient_hint, issued_at]
    privacy_note: "Tokens are pseudonymous; no contact data stored."
  whatsapp:
    compact_copy: true
    prefer_single_link: true
    newline_between_sentences: true
    avoid_markdown: true
    max_message_lines: 8
    use_numbered_options: true
    include_vcard_for_invites: false
    locale_emoji: { en: "📍", es: "📍" }
    group_share_detection: "heuristic_by_target_picker"

# ────────────────────────────────────────────────────────────────────────────────
flows:
  flow_invite:
    goal: "Create a single-venue invite with rich preview and easy sharing."
    steps:
      - id: shortlist
        do:
          if: inputs.location_context.chosen_neighbourhood or permissions.approximate_location_allowed
          then:
            result := call helpers.venue_search_localised with {activity_id: activity_context.activity_id, lat: user_lat_optional, lng: user_lng_optional, country_from_state: user_profile.locale.country?, open_now: false, radius_m: 2500}
            candidates := filter(result.candidates, r => (r.rating ?? 0) >= policy.result_quality.min_rating)
            save: { candidates, tried_log: result.tried_log }
          else:
            use: last_used_places or manual_search_field

      - id: choose_venue
        do:
          strategy: "Present 3–5 candidates; allow manual search"
          note: "Candidates sourced via localised sequential phrase search (see tried_log)."
          output: place_id

      - id: fetch_details
        do:
          call: place_details
          with: { place_id: $.choose_venue.place_id }
          cache: db.cache_place_details(place_id, ttl=24h)
          save: venue

      - id: compose_share_assets
        do:
          map_image: static_map_url(venue.lat, venue.lng, 16, "1200x630")
          ics_file: calendar_ics_create(
            title: "${activity_context.activity_name} meetup",
            start_iso: now_plus(2h),
            end_iso: now_plus(2h + activity_context.default_duration_mins),
            description: "Created in WotNow. ${venue.website or ''}",
            location_text: "${venue.name}, ${venue.address}",
            url: deep_link_maps(venue.place_id, venue.lat, venue.lng),
            geo_lat: venue.lat,
            geo_lng: venue.lng
          )
          og_tags:
            title: "Join me for ${activity_context.activity_name}"
            description: "${venue.name} · ${friendly_time(start_iso)}"
            image: map_image

      - id: shorten_url
        do:
          long_url: invite_page_url(activity_context.activity_name, venue.place_id, start_iso)
          short_url: shortlink_create(long_url, campaign="invite", tags=[activity_context.activity_name])
          save: short_url

      - id: create_recipient_tokens
        do:
          recipients: infer_from_share_target_or_unknown()
          tokens: map(recipients, r => link_sign({ kind: "invite", sharer_id: user_profile.user_id, recipient_hint: r, issued_at: now_iso(), url: short_url }))
          save: tokens

      - id: generate_message
        do:
          variant: ab_experiments.assign_user_to_variant(["A_short","B_detail","C_emoji"])
          template:
            when: tone_hint == 'group' -> 'GROUP_invite'
            else: 'DM_invite'
          message_text: render(template, {
            activity_name: activity_context.activity_name,
            start_time: friendly_time(start_iso),
            venue_name: venue.name,
            address: address_area_only(venue.address),
            directions_link: directions_link(venue),
            short_url: short_url
          })

      - id: share
        do:
          shareable_url: append_token(short_url, tokens.first_or_null)
          if: device_capabilities.web_share_api
          then: web_share({ title: "Join me: ${activity_context.activity_name}", text: message_text + "\n" + shareable_url })
          else:
            open_url("https://wa.me/?text=" + urlencode(message_text + "\n" + shareable_url))

      - id: seed_inference
        do:
          analytics_log("shortlink_seed", { shortlink_id: short_url, tone_hint })

      - id: schedule_host_followups
        do:
          notifications.schedule_local(
            "Quick check",
            "All set for ${activity_context.activity_name}?",
            fire_at_iso=now_plus(10m)
          )

      - id: analytics
        do:
          analytics_log("invite_sent", { activity: activity_context.activity_name, place_id: venue.place_id, variant, shortlink_id: short_url })
          analytics_log("venue_keywords_tried", { activity_id: activity_context.activity_id, tried: tried_log })

  flow_conditions_invite:
    when: activity_context.weatherSensitive == true
    goal: "Share a persuasive, conditions-based invite for an outdoor activity with one-tap RSVP."
    steps:
      - id: compute_conditions
        do:
          score: activity_score(activity_context.activity_id, where=spot, when=start_iso)
          reasons: top_reasons(activity_context.activity_id, score, weather_env)
          rating_word: pick(['Perfect','Good','Fair'], score)
          hero_badge: build_conditions_badge(activity_context.activity_id, score, reasons)

      - id: compose_share_assets
        do:
          og_tags:
            title: "${activity_context.activity_name} — ${rating_word} today (WotNow)"
            description: join_bullets(reasons, max=3)
            image: hero_badge
          ics:
            title: "${activity_context.activity_name} — ${rating_word} (WotNow)"
            description: join_bullets(reasons, max=5) + "\nRe-check live conditions → ${live_url}"
            location_text: "${spot.name}"
            url: invite_page_url(activity_context.activity_name, spot.id, start_iso)
            geo_lat: spot.lat
            geo_lng: spot.lng
            categories: ["WotNow","Outdoors", activity_context.activity_name]
            apple_structured_location: "geo:${spot.lat},${spot.lng};title=${spot.name};radius=65"
            valarm_trigger: "-PT2H"

      - id: shorten
        do:
          long_url: invite_page_url(activity_context.activity_name, spot.id, start_iso)
          short_url: shortlink_create(long_url, campaign="conditions_invite", tags=[activity_context.activity_name])

      - id: message
        do:
          text: |
            {{activity_context.activity_name}}? {{rating_word}} today {{emoji_for(activity_context.activity_id)}}
            {{spot.name}} • {{friendly_time(start_iso)}}
            {{reasons_line(reasons, max=2)}}
            {{short_url}}

      - id: share
        do:
          if: device_capabilities.web_share_api
          then: web_share({ title: "Join me: ${activity_context.activity_name}", text: text })
          else: open_url("https://wa.me/?text=" + urlencode(text))

      - id: produce_calendar
        do:
          ics_file: calendar_ics_create({{ics}})
          if: feature_flags.webcal_subscribe
          then: webcal_link: webcal_url_create(invite_id)

      - id: landing_config
        do:
          landing_page:
            shows:
              - live_conditions(score, reasons, spot)
              - rsvp_buttons: ["I'm in","Maybe","Can't"]
              - add_to_calendar(ics_file)
              - subscribe_webcal(webcal_link)
            after_rsvp_cta: "Create your own conditions card in 30 seconds →"

      - id: analytics
        do:
          analytics_log("conditions_invite_shared", { activity_id: activity_context.activity_id, spot_id: spot.id, score, rating_word, shortlink_id: short_url })

# ────────────────────────────────────────────────────────────────────────────────
message_templates:
  A_short: |
    Fancy {{activity_name}}?
    {{venue_name}} • {{start_time}}
    {{directions_link}}
  B_detail: |
    {{activity_name}} tonight?
    {{venue_name}} ({{address_area_only}})
    Starts {{start_time}} • {{directions_link}}
  C_emoji: |
    {{activity_name}} 🗓️ {{start_time}}
    📍 {{venue_name}}
    {{directions_link}}
  WA_compact: |
    {{activity_name}}?
    {{venue_name}}
    {{start_time}}
    {{directions_link}}
    {{short_url}}
  DM_invite: |
    Fancy {{activity_name}} at {{venue_name}}?
    {{start_time}} • {{directions_link}}
    {{short_url}}
  GROUP_invite: |
    Fancy {{activity_name}}?
    {{venue_name}} • {{start_time}}
    Confirm here:
    {{short_url}}

# ────────────────────────────────────────────────────────────────────────────────
ui_guidelines:
  - Always show venue photo or Static Map hero.
  - Show rating ★, price €–€€€, and “Open now / Closes HH:MM”.
  - Provide buttons: Open in Maps, Directions, Share, Add to Calendar.
  - On poll cards, show “Your ETA” pill if computed locally.
  - Countdown chip: “Voting closes in {{mm}}m”.

# ────────────────────────────────────────────────────────────────────────────────
error_handling:
  - places_quota_exceeded:
      fallback: "Permit manual address entry; still generate Static Map from typed lat/lng."
  - no_candidates_found:
      fallback: "Expand radius to 5–10 km; drop keyword to activity name only; try English phrases; finally prompt manual entry. Log venue_keywords_tried for diagnosis."
  - photo_unavailable:
      fallback: "Use Static Map at zoom 16."
  - web_share_unavailable:
      fallback: "Pre-fill WhatsApp link with URL-encoded message."
  - ics_creation_failed:
      fallback: "Show Add to Calendar deeplinks (Google/Apple)."

# ────────────────────────────────────────────────────────────────────────────────
experiments:
  - id: og_collage_vs_map
    hypothesis: "Collage of venue photos improves link CTR vs static map."
    variants: ["collage","static_map"]
    metric: "poll_click_through_rate"
  - id: short_vs_detail_copy
    variants: ["A_short","B_detail","C_emoji"]
    metric: "share_click_through_rate"
  - id: deadline_prompting
    variants: ["soft_nudge_15m","no_nudge"]
    metric: "time_to_decision_minutes"

# ────────────────────────────────────────────────────────────────────────────────
logging:
  events:
    - invite_sent
    - invite_opened
    - directions_clicked
    - ics_downloaded
    - share_failed
    - venue_keywords_tried
    - venue_candidates_shown
  event_props:
    common: [user_id_hash, locale, activity_id, variant, shortlink_id]
    invite_sent: [place_id, token_count]
    venue_keywords_tried: [activity_id, tried:json]
    venue_candidates_shown: [activity_id, place_ids[], count]
  pii_redaction: "Strip exact origins; hash user_id; store only aggregate ETAs."

# ────────────────────────────────────────────────────────────────────────────────
outputs:
  - shortlink_invite
  - og_image_url
  - ics_file_url
  - analytics_events
  - whatsapp_optimised_copy

# ────────────────────────────────────────────────────────────────────────────────
feature_flags:
  conditions_invite: true
  webcal_subscribe: true